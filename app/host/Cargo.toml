[package]
name = "xdj-host"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"
description = "XDJ-RX emulator orchestrator: supervises QEMU (per-instance QMP/VNC/control sockets), serves the virtual panel, prepares firmware, provisions and boots the emulated NAND unit, and bridges noVNC (WebSocket) to QEMU's VNC."

[[bin]]
name = "xdj-host"
path = "src/main.rs"

[dependencies]
xdj-fw = { path = "../../crates/xdj-fw" }
tokio = { version = "1.44.2", features = ["rt-multi-thread", "macros", "net", "io-util", "process", "signal", "time", "sync", "fs"] }
tokio-tungstenite = "0.24.0"
futures-util = "0.3.31"
sha2 = "0.10.8"
axum = { version = "0.7", default-features = false, features = ["http1", "tokio"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = 2
