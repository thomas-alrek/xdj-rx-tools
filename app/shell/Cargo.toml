[package]
name = "xdj-rx-shell"
version = "1.0.0"
edition = "2021"
license = "GPL-2.0-or-later"
description = "XDJ-RX desktop shell: a Tauri window that runs the xdj-host orchestrator and shows the live panel + noVNC screen."

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
url = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# macOS: lock the pop-out screen window to the framebuffer aspect (NSWindow.contentAspectRatio)
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSResponder", "NSWindow"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry"] }

[[bin]]
name = "xdj-rx-shell"
path = "src/main.rs"
