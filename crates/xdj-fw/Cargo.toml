[package]
name = "xdj-fw"
version = "1.0.0"
edition = "2021"
license = "GPL-2.0-or-later"
description = "XDJ-RX firmware tooling shared by xdj-host and the `xdj` CLI: .UPD decrypt/encrypt, ISO9660 (+Rock Ridge), cramfs, payload tarballs, custom-firmware builds, the update stick, and the emulated NAND image."

[lib]
path = "src/lib.rs"

[[bin]]
name = "xdj"
path = "src/bin/xdj.rs"

[dependencies]
aes = "0.8"
cbc = "0.1"
flate2 = "1"
crc32fast = "1"
zip = { version = "9.6.0", default-features = false, features = ["deflate", "deflate64"] }
tar = { version = "0.4", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = 2
