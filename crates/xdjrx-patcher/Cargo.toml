[package]
name = "xdjrx-patcher"
version = "1.0.0"
edition = "2021"
license = "GPL-2.0-or-later"
description = "Turns Pioneer's official XDJ-RX firmware 2.21 into a custom firmware release, from a small patch file (.xdjpatch), and verifies the result by MD5."

[[bin]]
name = "xdjrx-patcher"
path = "src/main.rs"

[dependencies]
xdj-fw = { path = "../xdj-fw" }
serde_json = "1"
md-5 = "0.10"
sha2 = "0.10"
tar = { version = "0.4", default-features = false }
zip = { version = "9.6.0", default-features = false, features = ["deflate64"] }
flate2 = "1"
ureq = { version = "2", default-features = false, features = ["tls"] }

[profile.release]
opt-level = 2
strip = true
