<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>XDJ-RX panel</title>
<!-- Knobs/faders: MIT "audio-knobs" (HowdyMoto/Knobs), served from /knobs/. Pure SVG. -->
<script src="/knobs/knobs.js"></script>
<style>
  :root{ --bg:#0a0b0d; --ink:#e8ebf0; --dim:#aeb6c0; --edge:#2b2f36; --edge2:#3a414b;
    --accent:#39b3ff; --ok:#39d98a; --red:#e5484d; --purp:#4a78ff; --panel:#14171c; }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:#070809;color:var(--ink);
    font:13px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    -webkit-user-select:none;user-select:none;display:flex;flex-direction:column}
  .bar{display:flex;align-items:center;gap:10px;padding:8px 14px;background:#131519;
    border-bottom:1px solid var(--edge);z-index:50;flex-wrap:wrap;flex:0 0 auto}
  .bar h1{font-size:13px;margin:0;letter-spacing:2px;font-weight:800;color:#cdd3db}
  .bar h1 b{color:var(--accent)}
  .bar .sp{flex:1}
  .conn{font-size:11px;padding:3px 10px;border-radius:20px;border:1px solid var(--edge);color:var(--red)}
  .conn.up{color:var(--ok);border-color:#2a6b4f}
  .tgl{appearance:none;border:1px solid var(--edge2);background:#1b1f26;color:var(--ink);
    border-radius:7px;padding:6px 11px;font-size:11px;font-weight:700;cursor:pointer}
  .tgl.deck{background:#13303f;border-color:#2a6b8f;color:#bfe3ff}
  .tgl.line{background:#3a2f1e;border-color:#6b572e;color:#ffe0a8}
  .tgl.red{background:#3a1e1f;border-color:#6b2e30;color:#ffb4b6}

  /* ---- console: fixed device aspect, controls placed absolutely (photo-calibrated) ---- */
  .stagewrap{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;padding:10px;container-type:size}
  #stage{position:relative;aspect-ratio:2142 / 1184;width:min(100cqw,calc(100cqh * 2142 / 1184));height:auto;flex:0 0 auto;
    background:radial-gradient(130% 100% at 50% 0%,#16191e,#0a0c0f 72%);
    border:1px solid #23272e;border-radius:14px;overflow:hidden;container-type:size;box-shadow:0 10px 40px #000a}
  /* decorative zone panels behind the controls */
  .pbg{position:absolute;background:linear-gradient(180deg,#14171c,#0f1216);border:1px solid #20242b;border-radius:1cqw;
    box-shadow:inset 0 1px 0 #ffffff08,0 2px 10px #0006}
  /* display housing + screen bezel */
  .pbg.disp{background:linear-gradient(180deg,#101318,#0b0d10);border-color:#262b33}
  .bezel{position:absolute;border-radius:.6cqw;background:#030405;
    box-shadow:0 0 0 1px #2a2f37,inset 0 0 0 1px #000,0 6px 18px #000a}
  /* engraved section labels */
  .lbl{position:absolute;transform:translate(-50%,-50%);font-size:.5cqw;font-weight:800;letter-spacing:.12cqw;
    color:#6c7581;white-space:nowrap;pointer-events:none}

  .hs{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:stretch;justify-content:center}
  .hs>.cell,.hs>.btn,.hs>.jogcell{width:100%;height:100%}

  /* ---- cells ---- */
  .cell{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-width:0;min-height:0}
  .kwrap{flex:1 1 auto;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;overflow:visible;position:relative}
  .kwrap svg{width:100%;height:100%;display:block}
  .cell.knob .kwrap svg,.cell.enc .kwrap svg,.cell.rot .kwrap svg{transform:scale(1.28)}
  .cap{font-size:.52cqw;line-height:1;color:var(--dim);font-weight:700;letter-spacing:.04cqw;
    white-space:nowrap;pointer-events:none;text-shadow:0 1px 2px #000;max-width:100%;overflow:hidden;text-overflow:ellipsis;flex:0 0 auto}

  /* buttons */
  .btn{cursor:pointer;border-radius:.3cqw;border:1px solid var(--edge2);width:100%;height:100%;min-height:10px;
    background:linear-gradient(180deg,#252b34,#181c22);color:#cfd5de;
    font-size:.5cqw;font-weight:800;letter-spacing:.03cqw;text-align:center;line-height:1.05;
    padding:0 .15cqw;overflow:hidden;transition:.05s;box-shadow:0 1px 0 #0007 inset;
    display:flex;align-items:center;justify-content:center;white-space:normal;overflow-wrap:anywhere}
  .btn.round{border-radius:50%;aspect-ratio:1/1;height:100%;width:auto;max-width:100%;margin:auto}
  .btn:hover{border-color:#525a66;color:#fff}
  .btn.down,.btn:active{background:linear-gradient(180deg,#1b4a63,#123246);border-color:var(--accent);
    color:#eaf6ff;box-shadow:0 0 10px #39b3ff66,0 1px 0 #0007 inset}
  .btn.pad{background:linear-gradient(180deg,#26324a,#1a2234);border-color:#3d5a9a;color:#b9c9f2;
    border-radius:.4cqw;font-size:.75cqw;box-shadow:inset 0 0 0 1px #00000040,inset 0 -.3cqw .6cqw #0006}
  .btn.pad:hover{border-color:#5b7fd0;color:#e4ebff}
  .btn.pad.down,.btn.pad:active{background:linear-gradient(180deg,#3a5bff,#2238d0);border-color:#7d9bff;color:#fff;
    box-shadow:0 0 .8cqw #4a78ff99}
  .btn.jogbtn{border-radius:50%;aspect-ratio:1/1;height:100%;width:auto;max-width:100%;margin:auto;
    border:1px solid #5a616c;color:#eef1f5;font-weight:800;font-size:.8cqw;
    background:radial-gradient(circle at 50% 32%,#545a64,#262a31 72%);box-shadow:0 3px 9px #000b,inset 0 1px 0 #ffffff22}
  .btn.jogbtn:hover{border-color:#7b8491;color:#fff}
  .btn.jogbtn.down,.btn.jogbtn:active{background:radial-gradient(circle at 50% 32%,#6c737e,#30353d);box-shadow:inset 0 2px 7px #000b}
  .btn.jogbtn.play{background:radial-gradient(circle at 50% 32%,#51805f,#1d3827 72%);border-color:#3f7a57;color:#ddffea}
  .btn.jogbtn.play.down,.btn.jogbtn.play:active{background:radial-gradient(circle at 50% 32%,#63df93,#1e7a46)}
  .btn.sw{flex-direction:column;gap:.1cqw}
  .btn.sw .swv{color:var(--accent);font-size:.55cqw}
  /* LED state from rbp (SubTxData back-channel, /leds). Independent of .down (finger). */
  .btn.lit{--l:var(--led,#ffb02e);border-color:var(--l);color:#fff;
    box-shadow:0 0 .7cqw var(--l),inset 0 0 .45cqw var(--l),0 1px 0 #0007 inset}
  .btn.pad.lit{background:linear-gradient(180deg,#3b3020,#251c12)}
  .btn.jogbtn.lit{border-color:var(--l);box-shadow:0 0 1.1cqw var(--l),0 0 .25cqw var(--l),inset 0 0 .8cqw var(--l)}
  /* grid rows, not flex-fill: flex children collapse to 0 in WKWebView (the .app) */
  .meter{width:100%;height:100%;display:grid;grid-template-rows:repeat(12,1fr);row-gap:2px;padding:2px;border-radius:3px;
    background:#050608;box-shadow:inset 0 0 0 1px #000,0 0 0 1px #1d2128}
  .meter i{display:block;min-height:1px;border-radius:1px;background:#16301f}
  /* children are top-down (segment 11 first): yellow = segs 8-9, red = segs 10-11 */
  .meter i:nth-child(-n+4){background:#3a3216}  .meter i:nth-child(-n+2){background:#3b1717}
  .meter i.on{background:#39d98a;box-shadow:0 0 4px #39d98a99}
  .meter i:nth-child(-n+4).on{background:#ffcc33;box-shadow:0 0 4px #ffcc3399}
  .meter i:nth-child(-n+2).on{background:#ff4040;box-shadow:0 0 4px #ff404099}
  .metercell{display:grid;width:100%;height:100%}
  /* centre LEVEL bank, as on the device: CH1 | MASTER | CH2 (grid rows, see WebKit note above) */
  .meterbank{display:grid;grid-template-columns:1fr 1.5fr 1fr;grid-template-rows:auto 1fr auto;column-gap:18%;row-gap:.35cqw;
    width:100%;height:100%;padding:.4cqw .5cqw;border-radius:.4cqw;background:#0b0d10;box-shadow:inset 0 0 0 1px #1d2128}
  .meterbank .cap{text-align:center;white-space:nowrap;overflow:visible;text-overflow:clip;min-width:0;justify-self:center}
  .meterbank .cap.lv{grid-column:1/-1}
  /* jog ring illumination: rbp sends a 1..36 position (or 0 = whole ring) */
  .jogled{position:absolute;inset:1.5%;border-radius:50%;pointer-events:none;opacity:0;z-index:2;
    filter:drop-shadow(0 0 .35cqw #ff9a2e);
    -webkit-mask:radial-gradient(circle closest-side,transparent 88%,#000 89%,#000 99%,transparent 100%);
    mask:radial-gradient(circle closest-side,transparent 88%,#000 89%,#000 99%,transparent 100%)}
  .jogled.on{opacity:1}
  .btn.unmapped{color:#6a727d;background:linear-gradient(180deg,#1a1e24,#14171c);border-color:#2a2f37;cursor:default}
  .btn.unmapped:hover{color:#6a727d;border-color:#2a2f37}

  /* jog platter */
  .jogcell{min-width:0;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .jog{aspect-ratio:1/1;width:100%;height:auto;max-height:100%;margin:auto;border-radius:50%;position:relative;
    cursor:grab;touch-action:none;
    background:radial-gradient(circle,#0a0b0d 66%,#2a2f36 67.5%,#14171b 70%,#0d0f12 100%);
    box-shadow:0 1.2cqw 2.4cqw #000d,0 0 0 1px #000,inset 0 1px 0 #ffffff14}
  .jog:active{cursor:grabbing}
  /* knurled grip ring (static) */
  .jog::before{content:"";position:absolute;inset:2.5%;border-radius:50%;pointer-events:none;
    background:repeating-conic-gradient(#2b3038 0deg 1.5deg,#15181d 1.5deg 3deg);
    -webkit-mask:radial-gradient(circle,transparent 87%,#000 87.5%);mask:radial-gradient(circle,transparent 87%,#000 87.5%);opacity:.9}
  /* rotating platter */
  .jogspin{position:absolute;inset:13%;border-radius:50%;pointer-events:none;will-change:transform;
    background:
      radial-gradient(circle,transparent 61%,#ffffff10 61.5%,transparent 63%),
      repeating-radial-gradient(circle,#1c1f24 0 1.2%,#16191d 1.2% 2.4%);
    box-shadow:inset 0 0 0 1px #000}
  /* fixed lighting over the platter (does NOT rotate) */
  .jogshade{position:absolute;inset:13%;border-radius:50%;pointer-events:none;
    background:radial-gradient(circle at 50% 30%,#ffffff12,transparent 55%),radial-gradient(circle at 50% 100%,#0008,transparent 60%);
    box-shadow:inset 0 .4cqw 1cqw #ffffff0d,inset 0 -1cqw 2cqw #0009}
  .jogspin::before{content:"";position:absolute;left:50%;top:2.5%;width:1.6%;height:22%;transform:translateX(-50%);
    border-radius:1cqw;background:linear-gradient(180deg,#e8ecf1,#8f98a4);box-shadow:0 0 .4cqw #000}
  /* centre cap (static) */
  .jogcap{position:absolute;inset:37%;border-radius:50%;pointer-events:none;
    background:radial-gradient(circle at 50% 30%,#4a505a,#22262c 60%,#16191d);
    box-shadow:0 .3cqw .9cqw #000c,inset 0 1px 0 #ffffff26,0 0 0 1px #000;transition:box-shadow .12s}
  .jog.touch .jogcap{box-shadow:0 .3cqw .9cqw #000c,inset 0 1px 0 #ffffff26,0 0 0 2px #39b3ff,0 0 1.2cqw #39b3ff88}

  /* vertical faders (tempo / channel) */
  .cell.vfader{justify-content:stretch}
  .vtrack{position:relative;flex:1 1 auto;min-height:20px;width:100%;cursor:ns-resize}
  .vtrack::before{content:"";position:absolute;left:50%;top:5%;bottom:5%;width:5px;transform:translateX(-50%);
    background:linear-gradient(90deg,#050608,#1b1f26,#050608);border-radius:3px;box-shadow:inset 0 0 4px #000c,0 0 0 1px #000}
  .vtrack.ctr::after{content:"";position:absolute;left:50%;top:50%;width:46%;height:2px;transform:translate(-50%,-50%);background:#444b55}
  .vthumb{position:absolute;left:50%;width:80%;max-width:26px;min-width:12px;height:12%;min-height:8px;max-height:15px;
    transform:translate(-50%,50%);border-radius:4px;border:1px solid #0009;pointer-events:none;
    background:linear-gradient(180deg,#d7dde4,#8b94a1);box-shadow:0 2px 6px #0009,inset 0 1px 0 #fff6}

  /* crossfader (horizontal) */
  .cell.xf{flex-direction:column;justify-content:center}
  .htrack{position:relative;width:100%;flex:1 1 auto;min-height:10px;max-height:22px;margin:auto 0;cursor:ew-resize}
  .htrack::before{content:"";position:absolute;top:50%;left:2%;right:2%;height:5px;transform:translateY(-50%);
    background:linear-gradient(180deg,#050608,#1b1f26,#050608);border-radius:3px;box-shadow:inset 0 0 4px #000c,0 0 0 1px #000}
  .hthumb{position:absolute;top:50%;height:150%;max-height:26px;width:13%;max-width:20px;min-width:11px;
    transform:translate(-50%,-50%);border-radius:4px;border:1px solid #0009;pointer-events:none;
    background:linear-gradient(90deg,#d7dde4,#8b94a1);box-shadow:0 2px 6px #0009,inset 0 1px 0 #fff6}

  /* browse encoder centre push */
  .encpush{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:46%;height:auto;aspect-ratio:1/1;border-radius:50%;
    background:radial-gradient(circle at 50% 34%,#2c333d,#13171e);border:1px solid #3a414b;color:#aeb6c0;
    font-size:.5cqw;font-weight:800;letter-spacing:.05cqw;cursor:pointer;
    display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px #000a,inset 0 1px 0 #ffffff12}
  .encpush:hover{color:#fff;border-color:#55606e}
  .encpush.down{background:radial-gradient(circle at 50% 34%,#1b4a63,#0e2636);border-color:var(--accent);
    color:#eaf6ff;box-shadow:0 0 12px #39b3ff88}

  /* screen */
  #screen{position:absolute;background:#000;border-radius:.2cqw;overflow:hidden;display:flex;align-items:center;justify-content:center}
  #screen canvas{width:100%!important;height:100%!important;display:block}
  /* noVNC hides the local cursor and draws the remote one; the firmware has no cursor,
     so force our normal pointer over the display area instead of an invisible one. */
  #screen,#screen *{cursor:default!important}
  .flip{display:inline-block;transform:scaleX(-1)}
  /* pop-out screen window (?screen=1): only the live screen, letterboxed to fill the window */
  body.screenonly{background:#000;overflow:hidden}
  body.screenonly>*:not(#screen){display:none!important}
  body.screenonly #screen{position:fixed;inset:0;border-radius:0}
  body.screenonly #screen canvas{object-fit:contain}

  .logwrap{flex:0 0 auto;padding:8px 14px}
  #logbox{height:46px;overflow:auto;background:#0b0d10;border:1px solid var(--edge);border-radius:8px;
    padding:6px 9px;font:11px/1.45 ui-monospace,Menlo,monospace;color:#9aa7b4;white-space:pre-wrap;
    -webkit-user-select:text;user-select:text;cursor:text}
</style>
</head>
<body>
<div class="bar">
  <h1>PIONEER <b>XDJ-RX</b> · VIRTUAL PANEL</h1>
  <span id="conn" class="conn">screen: …</span>
  <span class="sp"></span>
  <button class="tgl" id="popscr" title="Open the live screen in its own resizable window">⧉ Screen</button>
  <button class="tgl deck" id="src0" title="CH1 input source (DECK / LINE·PHONO)">CH1: DECK</button>
  <button class="tgl deck" id="src1" title="CH2 input source (DECK / LINE·PHONO)">CH2: DECK</button>
  <button class="tgl red" id="brel">Release all</button>
</div>

<div class="stagewrap"><div id="stage"></div></div>
<div class="logwrap"><div id="logbox"></div></div>

<script>
// ===== control registry (metadata) =======================================
// ===== control registry ===================================================
// Verified against the firmware: every spec below was injected into a running rbp and
// the code it dispatched was captured at the panel event dispatcher (0x2a47c0), then
// named with rbp's own debug-console vocabulary (button/knob/rotary tables). See
// docs/subucom-frame-map.md. Buttons are HELD while pressed (B) and released by name;
// switches are persistent multi-bit fields (S off mask bits); A = 16-bit analog.
const C = {
  // mic / master strips (MIC level knobs are not in the sub-ucom frame)
  mic1:{l:'MIC1'}, mic2:{l:'MIC2'},
  miceqhi:{l:'HI',t:'knob',spec:'A 46',v:512}, miceqlow:{l:'LOW',t:'knob',spec:'A 44',v:512},
  micsw:{l:'MIC',t:'switch',off:0x5b,mask:0xc0,pos:['OFF','ON','TALK'],bits:[0x40,0x00,0x80],v:1},
  usb1stop:{l:'USB1 STOP',spec:'B 5e 10'}, usb1load:{l:'USB1 LOAD',usb:'usb1'},
  usb2stop:{l:'USB2 STOP',spec:'B 5e 08'}, usb2load:{l:'USB2 LOAD',usb:'usb2'},
  booth:{l:'BOOTH',t:'knob',spec:'A 48',v:512}, masterlvl:{l:'MASTER',t:'knob',spec:'A 4a',v:512},
  mrec:{l:'MASTER REC'}, tmark:{l:'TRACK MARK',spec:'B 5e 02'},
  // display keys (top-panel MAIN-UCOM GPIOs) + quantize
  src_rb:{l:'rekordbox',gpio:159}, src_midi:{l:'MIDI',gpio:161},
  src_usb1:{l:'USB1',gpio:160}, src_usb2:{l:'USB2',gpio:158},
  quant:{l:'QUANTIZE',spec:'B 5e 20'}, deck12:{l:'DECK 1/2',gpio:149}, timemd:{l:'TIME MODE',gpio:146},
  // browse section
  browse:{l:'BROWSE',spec:'B 5f 08'}, taglist:{l:'TAG LIST',spec:'B 5f 04'},
  info:{l:'INFO',spec:'B 5f 02'}, menu:{l:'MENU',spec:'B 5f 01'},
  back:{l:'BACK',spec:'B 5e 01'}, tagtrk:{l:'TAG TRK',spec:'B 5d 80',tip:'TAG TRACK'},
  enc:{l:'BROWSE',t:'encoder',pushSpec:'B 5d 10'},
  loadL:{l:'◄ LOAD',spec:'B 5d 40',tip:'LOAD to deck 1'}, loadR:{l:'LOAD ►',spec:'B 5d 20',tip:'LOAD to deck 2'},
  // channel strips
  deck1src:{l:'PH/LN',gpio:119}, deck2src:{l:'PH/LN',gpio:120},
  trim1:{l:'TRIM',t:'knob',spec:'A 26',v:512,mid:true}, trim2:{l:'TRIM',t:'knob',spec:'A 36',v:512,mid:true},
  eq_hi1:{l:'HI',t:'knob',spec:'A 24',v:512,mid:true}, eq_hi2:{l:'HI',t:'knob',spec:'A 34',v:512,mid:true},
  eq_mid1:{l:'MID',t:'knob',spec:'A 2a',v:512,mid:true}, eq_mid2:{l:'MID',t:'knob',spec:'A 3a',v:512,mid:true},
  eq_low1:{l:'LOW',t:'knob',spec:'A 28',v:512,mid:true}, eq_low2:{l:'LOW',t:'knob',spec:'A 38',v:512,mid:true},
  color1:{l:'COLOR',t:'knob',spec:'A 2e',v:512,mid:true}, color2:{l:'COLOR',t:'knob',spec:'A 3e',v:512,mid:true},
  ch1:{l:'CH1',t:'vfader',spec:'A 2c',v:1023}, ch2:{l:'CH2',t:'vfader',spec:'A 3c',v:1023},
  xf:{l:'CROSSFADER',t:'xfader',spec:'A 4e',v:512},
  xfcurve:{l:'XF CURVE',t:'switch',off:0x5b,mask:0x30,pos:['1','2','3'],bits:[0x10,0x00,0x20],v:1},
  // sound colour FX
  // rbp blinks the active COLOR FX / BEAT FX ON LEDs; `steady` shows them as a constant glow instead
  scfx_noise:{l:'NOISE',spec:'B 59 80',led:[0x13,3,1],ledc:'#39b3ff',steady:true}, scfx_gate:{l:'GATE',spec:'B 59 40',led:[0x13,2,1],ledc:'#39b3ff',steady:true},
  scfx_crush:{l:'CRUSH',spec:'B 59 20',led:[0x13,1,1],ledc:'#39b3ff',steady:true}, scfx_filter:{l:'FILTER',spec:'B 59 10',led:[0x13,0,1],ledc:'#39b3ff',steady:true},
  // headphones
  hp_mix:{l:'HP MIX',t:'knob',spec:'A 52',v:512}, hp_lvl:{l:'HP LVL',t:'knob',spec:'A 50',v:512},
  cue1:{l:'CUE1',spec:'B 5b 02',led:[0x0a,5]}, cue2:{l:'CUE2',spec:'B 5b 01',led:[0x0a,4]},
  // level meters (12-segment bar + peak dot, 16-bit LE bitmask in the LED frame)
  meter1:{l:'CH1',t:'meter',meter:0x0e}, meter2:{l:'CH2',t:'meter',meter:0x0c}, meterM:{l:'MASTER',t:'meter',meter:0x08},
  meters:{l:'LEVEL',t:'meterbank',ids:['meter1','meterM','meter2']},
  // beat FX
  beatL:{l:'BEAT ◄',spec:'B 5a 02'}, beatR:{l:'BEAT ►',spec:'B 5a 01'},
  fxsel:{l:'FX SELECT',t:'selector',off:0x5a,mask:0xe0,bitsOf:p=>(7-p)<<5,v:0,
    pos:['DELAY','ECHO','SPIRAL','REVERB','TRANS','FLANGER','PITCH','ROLL']},
  fxch:{l:'CH SELECT',t:'selector',off:0x5a,mask:0x1c,bitsOf:p=>(5-p)<<2,v:5,
    pos:['1','2','MIC','CF.1','CF.2','MASTER']},
  fxtime:{l:'TIME',t:'counter',spec:'A 56'},
  fxlev:{l:'DEPTH',tip:'LEVEL/DEPTH',t:'knob',spec:'A 4c',v:512},
  fxon:{l:'ON/OFF',spec:'B 5b 04',round:true,led:[0x13,6,1],ledc:'#ffcc33',steady:true}, fxtap:{l:'TAP',spec:'B 5b 08',round:true},
};

function deckControls(n){ const o=(n-1)*0x10, h=v=>(v+o).toString(16).padStart(2,'0'), p='d'+n;
  const B=(off,m)=>'B '+h(off)+' '+m;
  const lo=(n-1)*4, Ld=(byte,bit,low)=>[byte+lo,bit,low?1:0];   // LED frame: deck2 = deck1 + 4 bytes
  Object.assign(C,{
    [p+'in']:{l:'IN',spec:B(0x13,'02'),led:Ld(3,6,1),ledc:'#ff9a2e'}, [p+'out']:{l:'OUT',spec:B(0x13,'01'),led:Ld(3,5,1),ledc:'#ff9a2e'},
    [p+'reloop']:{l:'RELOOP',spec:B(0x12,'80'),led:Ld(3,4),ledc:'#ff9a2e'},
    [p+'_call_l']:{l:'◄',spec:B(0x13,'20'),tip:'CUE/LOOP CALL ◄'}, [p+'_call_r']:{l:'►',spec:B(0x13,'10'),tip:'CUE/LOOP CALL ►'},
    [p+'_delete']:{l:'DEL',spec:B(0x13,'08')}, [p+'_memory']:{l:'MEM',spec:B(0x13,'04')},
    [p+'_vinyladj']:{l:'BRAKE',tip:'VINYL SPEED ADJ (TOUCH/BRAKE)',t:'knob',spec:'A '+h(0x06),v:512},

async function post(p,b){ try{ await fetch(p,{method:'POST',body:b||''}); }catch(e){ log('POST '+p+' failed'); } }

// USB mount: in the app, open a native file dialog via the Tauri `pick_usb_image`
// command; in a plain dev browser, fall back to a typed path. Either way the chosen
// path is POSTed to /usb, which does the drive_add/device_add insert.
const _lastUsb={usb1:'',usb2:''};
async function doMount(slot, path){
  const S=slot.toUpperCase(); _lastUsb[slot]=path; log('⏏ '+S+': mounting '+path+' …');
  try{ const r=await fetch('/usb',{method:'POST',body:slot+' '+path}); const t=(await r.text()).trim();
    log((r.ok?'✔ ':'✖ ')+t); }catch(e){ log('✖ '+S+' mount request failed'); }
}
async function mountUsb(slot){
  const S=slot.toUpperCase();
  const D=window.__TAURI__ && window.__TAURI__.dialog;
  if(D && D.open){
    log('⏏ '+S+': choosing an image…');
    try{ const p=await D.open({ multiple:false, directory:false,
        title:'Select a USB disk image for '+S,
        filters:[{name:'Disk images',extensions:['img','dmg','iso','bin','raw']},
                 {name:'All files',extensions:['*']}] });
      if(!p){ log('… '+S+' cancelled'); return; }
      return doMount(slot, Array.isArray(p)?p[0]:p);
    }catch(e){ log('✖ file dialog failed: '+e); return; }
  }
  // dev browser (no Tauri): type a path
  const p=prompt('Mount USB on '+S+'\nPath to a disk image (.img / .dmg) or a device (/dev/...):',
    _lastUsb[slot]||'');
  if(p==null) return; const path=p.trim(); if(path) doMount(slot, path);
}

const Kn=window.Knobs;
const KS={showValueDisplay:false,showValueLabels:false,showTicks:false,label:'',fontFamily:'inherit',
  dialColor:'#20242b',bezelColor:'#30353d',indicatorColor:'#39b3ff',tickColor:'#4a515b'};
const d=(cls)=>{ const e=document.createElement('div'); if(cls)e.className=cls; return e; };
const kwrap=(n)=>{ const w=d('kwrap'); w.appendChild(n); return w; };
const cap=(t)=>{ const e=d('cap'); e.textContent=t; return e; };

// ◄ (U+25C4) and ► (U+25BA) come from different fallback fonts under the system font, so
// they render at different sizes. Draw every ◄ as a mirrored ► so both directions match.
function setLabel(el,t){ el.textContent='';
  for(const part of t.split(/(◄)/)){ if(!part) continue;
    if(part==='◄'){ const f=document.createElement('span'); f.className='flip'; f.textContent='►'; el.appendChild(f); }
    else el.appendChild(document.createTextNode(t.includes('◄')?part.replace(/ /g,'\u00a0'):part)); } }   // flex trims spaces next to the span
function btnCell(id){ const c=C[id];
  const el=d('btn'+(c.round?' round':'')+(c.big?' jogbtn':'')+(c.pad?' pad':'')+(c.play?' play':''));
  const mapped=!!(c.spec||c.gpio||c.usb); if(!mapped) el.classList.add('unmapped');
  if(c.led){ LEDS.push({el,b:c.led[0],m:1<<c.led[1],low:!!c.led[2],steady:!!c.steady,t:null}); if(c.ledc) el.style.setProperty('--led',c.ledc); }
  setLabel(el,c.l); const name=c.tip||c.l;
  el.title=name+(c.spec?('  ['+c.spec+']'):(c.gpio?('  [gpio '+c.gpio+']'):(c.usb?'  (mount a USB image/device)':'  (not in the panel frame)')));
  // Real-hardware semantics: the bit is HELD for as long as the button is down
  // (so long-press, SHIFT combos and hold-to-scan work), released by name on up.
  el.addEventListener('pointerdown',e=>{ e.preventDefault();
    if(c.usb){ el.classList.add('down'); setTimeout(()=>el.classList.remove('down'),160); mountUsb(c.usb); return; }
    if(c.gpio){ el.classList.add('down'); mainkey(c.gpio); return; }
    if(!c.spec){ log('· '+name+' — not in the panel frame'); return; }
    try{ el.setPointerCapture(e.pointerId); }catch(_){}
    el.classList.add('down'); sctrl(c.spec); log('▸ '+name+'  '+c.spec); });
  const up=()=>{ if(!el.classList.contains('down')) return; el.classList.remove('down');
    if(c.gpio){ mainkeyRelease(); return; }
    if(c.spec) release(c.spec); };
  el.addEventListener('pointerup',up); el.addEventListener('pointercancel',up); el.addEventListener('lostpointercapture',up);
  return el;
}
// Multi-position switch (XF CURVE, MIC OFF/ON/TALK): click cycles; a persistent field.
const swLine=(c,bits)=>'S '+c.off.toString(16)+' '+c.mask.toString(16)+' '+bits.toString(16);
function switchCell(id){ const c=C[id]; let p=c.v||0;
  const el=d('btn sw'); const show=()=>{ el.innerHTML=''; const a=d('swl'); a.textContent=c.l; const b=d('swv'); b.textContent=c.pos[p]; el.append(a,b); };
  el.title=c.l+' — click to switch ('+c.pos.join(' / ')+')';
  el.addEventListener('pointerdown',e=>{ e.preventDefault(); p=(p+1)%c.pos.length; show(); sctrl(swLine(c,c.bits[p])); log('▸ '+c.l+' = '+c.pos[p]); });
  show(); return el;
}
function knobCell(id){ const c=C[id]; const el=d('cell knob'); const m=d();
  try{ const k=new Kn.Knob(m,Object.assign({},KS,{mode:'bounded',min:0,max:1023,value:c.v==null?512:c.v,size:100}));
    if(isAnalog(c.spec)) k.onChange(e=>sctrl(c.spec+' '+Math.round(e.value).toString(16)));
    // channel-strip knobs (TRIM / EQ / COLOR): double-click snaps back to the mid position
    if(c.mid) m.addEventListener('dblclick',e=>{ e.preventDefault(); k.setValue(512); });
  }catch(e){ m.textContent='⊘'; }
  el.append(kwrap(m)); if(c.l) el.appendChild(cap(c.l)); el.title=c.l; return el;
}
// Centre-detent faders (TEMPO, CROSSFADER): drag moves the thumb relative to where you grab
// (no jump on press, so a double-click doesn't nudge it); a double-click snaps back to the
// default (centre) position.
function centerDrag(track,axis,get,set,def){ let st=null;
  const pos=e=>axis==='x'?e.clientX:e.clientY;
  track.addEventListener('pointerdown',e=>{ e.preventDefault(); try{track.setPointerCapture(e.pointerId);}catch(_){}
    const r=track.getBoundingClientRect(); st={p:pos(e),v:get(),moved:false,span:(axis==='x'?r.width:r.height*0.9)||1}; });
  track.addEventListener('pointermove',e=>{ if(!st) return; const dp=pos(e)-st.p;
    if(!st.moved && Math.abs(dp)<4) return; st.moved=true;
    const f=(axis==='x'?dp:-dp)/st.span; set(Math.max(0,Math.min(1023,st.v+f*1023))); });
  track.addEventListener('pointerup',()=>{ st=null; });
  track.addEventListener('dblclick',e=>{ e.preventDefault(); set(def); });
  track.addEventListener('pointercancel',()=>{ st=null; });
}
function faderCell(id){ const c=C[id]; const center=c.t==='vfader-c'; const el=d('cell vfader');
  const track=d('vtrack'+(center?' ctr':'')); const thumb=d('vthumb'); track.appendChild(thumb);
  let val=c.v==null?(center?512:0):c.v;
  const show=()=>{ thumb.style.bottom=(5+val/1023*90)+'%'; };   // keep the thumb inside the track
  const emit=()=>{ if(center && c.specNeg && c.specPos){ const lo=Math.round(val),hi=1023-lo;
      sctrl(c.specNeg+' '+lo.toString(16)+'\n'+c.specPos+' '+hi.toString(16)); }
    else if(isAnalog(c.spec)) sctrl(c.spec+' '+Math.round(val).toString(16)); };
  if(center){ centerDrag(track,'y',()=>val,v=>{ val=v; show(); emit(); },c.v==null?512:c.v); show(); }
  else { const fromY=e=>{ const r=track.getBoundingClientRect(); let f=1-(e.clientY-r.top)/r.height;
    val=Math.max(0,Math.min(1,f))*1023; show(); emit(); };
  let drag=false;
  track.addEventListener('pointerdown',e=>{ e.preventDefault(); drag=true; try{track.setPointerCapture(e.pointerId);}catch(_){} fromY(e); });
  track.addEventListener('pointermove',e=>{ if(drag) fromY(e); });
  const end=()=>{ drag=false; }; track.addEventListener('pointerup',end); track.addEventListener('pointercancel',end);
  show(); } el.append(track); if(c.l) el.appendChild(cap(c.l)); el.title=c.l; return el;
}
function xfaderCell(id){ const c=C[id]; const el=d('cell xf'); const track=d('htrack'); const thumb=d('hthumb'); track.appendChild(thumb);
  let val=c.v==null?512:c.v;
  const show=()=>{ thumb.style.left=(val/1023*100)+'%'; };
  centerDrag(track,'x',()=>val,v=>{ val=v; show(); if(isAnalog(c.spec)) sctrl(c.spec+' '+Math.round(val).toString(16)); },c.v==null?512:c.v);
  show(); el.append(track); el.title=c.l; return el;
}
// Endless-knob widget helper: calls step(+1/-1) per detent of `deg` degrees.
function infinite(m,opts,deg,step){ let last=null,acc=0;
  const k=Kn.createInfiniteKnob(m,Object.assign({},KS,opts));
  k.onChange(e=>{ if(last==null){last=e.value;return;} acc+=e.value-last; last=e.value;
    while(acc>=deg){acc-=deg; step(1);} while(acc<=-deg){acc+=deg; step(-1);} }); return k; }
// Rotary SELECTOR switch (FX SELECT 8 positions, CH SELECT 6): a bounded detent knob.
// The dial snaps to one tick per position and stops at both ends (not endless); the
// absolute position is packed into a byte field and the caption names it.
function selectorCell(id){ const c=C[id]; const el=d('cell rot'); const m=d(); let p=c.v||0; const capEl=cap('');
  const n=c.pos.length; const show=()=>{ capEl.textContent=c.pos[p]; capEl.title=c.l; };
  const set=q=>{ q=Math.max(0,Math.min(n-1,q)); if(q===p) return; p=q; show(); sctrl(swLine(c,c.bitsOf(p))); };
  try{ const k=new Kn.Knob(m,Object.assign({},KS,{mode:'bounded',min:0,max:n-1,step:1,value:p,size:120,
      showTicks:true,tickCount:n,pixelsPerFullRotation:40*(n-1)}));
    // Snap the dial: the library rotates by its raw (unrounded) value while dragging;
    // draw the stepped value instead, and drop the leftover fraction on release.
    const uv=k.updateVisuals; k.updateVisuals=function(){ this.angle=this.valueToAngle(this.value); uv.call(this); };
    const ed=k.endDrag; k.endDrag=function(){ this.rawValue=this.value; ed.call(this); };
    k.setValue(p); k.onChange(e=>set(Math.round(e.value)));
    let wa=0; el.addEventListener('wheel',ev=>{ ev.preventDefault(); wa+=ev.deltaY*(ev.deltaMode?16:1);
      if(Math.abs(wa)>=60){ const s=wa<0?1:-1; wa=0; k.setValue(Math.max(0,Math.min(n-1,p+s))); } },{passive:false});
  }catch(e){ m.textContent='⊘'; }
  el.append(kwrap(m),capEl); show(); el.title=c.l+' — turn to select ('+c.pos.join(' / ')+')'; return el;
}
// Endless ENCODER reported as a 16-bit counter the firmware diffs (BEAT FX TIME @0x56).
function counterCell(id){ const c=C[id]; const el=d('cell rot'); const m=d(); let n=0;
  try{ infinite(m,{size:120,gripBumps:false},.5,s=>{ n=(n+s)&0xffff; sctrl(c.spec+' '+n.toString(16)); }); }catch(e){ m.textContent='⊘'; }
  el.append(kwrap(m),cap(c.l)); el.title=c.l+' — endless encoder'; return el;
}
function encoderCell(id){ const c=C[id]; const el=d('cell enc'); const m=d(); let last=null,acc=0,t=0; const STEP=.35;
  try{ const k=Kn.createInfiniteKnob(m,Object.assign({},KS,{size:120,gripBumps:true,gripBumpCount:30,
      dialColor:'#1b1f26',bezelColor:'#343b45'}));
    k.onChange(e=>{ if(last==null){last=e.value;return;} let dd=e.value-last; last=e.value; acc+=dd; const now=performance.now();
      while(acc>=STEP){acc-=STEP; if(now-t>16){post('/browse','1');t=now;}}
      while(acc<=-STEP){acc+=STEP; if(now-t>16){post('/browse','-1');t=now;}} });
  }catch(e){ m.textContent='⊘'; }
  const kw=kwrap(m);
  const push=d('encpush'); push.textContent='PUSH';
  push.addEventListener('pointerdown',ev=>{ ev.preventDefault(); ev.stopPropagation(); push.classList.add('down');
    sctrl(c.pushSpec); log('▸ BROWSE push'); });
  const pup=()=>{ if(push.classList.contains('down')){ push.classList.remove('down'); release(c.pushSpec); } };
  push.addEventListener('pointerup',pup); push.addEventListener('pointerleave',pup);
  kw.appendChild(push); el.appendChild(kw);
  let wa=0,wt=null; el.addEventListener('wheel',ev=>{ ev.preventDefault(); let dy=ev.deltaY;
    if(ev.deltaMode===1)dy*=16; else if(ev.deltaMode===2)dy*=400; wa+=dy;
    if(!wt) wt=setTimeout(()=>{ wt=null; let s=Math.max(-3,Math.min(3,Math.trunc(wa/80)));
      if(s){ wa-=s*80; post('/browse',String(s)); } else if(Math.abs(wa)>320) wa=0; },70); },{passive:false});
  el.title='BROWSE — rotate to scroll, push to select'; return el;
}
// Jog: rbp reads a 16-bit position counter + pulse period + direction/touch flags
// (FUN_00283dc4 -> code 0x4306). The panel streams the platter angle to /jog, which
// turns it into counter ticks and a speed-derived period; touch = holding the platter.
function jogCell(id){ const c=C[id]; const el=d('cell jogcell'); const j=d('jog');
  const spin=d('jogspin'), ring=d('jogled'); j.append(spin,d('jogshade'),d('jogcap'),ring);
  JOGLEDS.push({el:ring,b:(c.deck-1)*4});
  let rot=0; const turn=dd=>{ rot+=dd; spin.style.transform='rotate('+rot+'deg)'; };   // visual platter angle
  let pend=0, tLast=performance.now(), timer=null;
  const flush=()=>{ timer=null; if(!pend) return; const now=performance.now();
    post('/jog', c.deck+' move '+pend.toFixed(2)+' '+Math.max(.005,(now-tLast)/1000).toFixed(4)); pend=0; tLast=now; };
  const move=dd=>{ turn(dd); if(!pend) tLast=performance.now()-16; pend+=dd; if(!timer) timer=setTimeout(flush,16); };
  let dragging=false,lastA=null;
  const ang=e=>{ const r=j.getBoundingClientRect(); return Math.atan2(e.clientY-(r.top+r.height/2),e.clientX-(r.left+r.width/2))*180/Math.PI; };
  j.addEventListener('pointerdown',e=>{ e.preventDefault(); dragging=true; lastA=ang(e); j.classList.add('touch');
    try{ j.setPointerCapture(e.pointerId); }catch(_){} post('/jog', c.deck+' touch 1'); });
  j.addEventListener('pointermove',e=>{ if(!dragging) return; const a=ang(e); let dd=a-lastA;
    if(dd>180)dd-=360; if(dd<-180)dd+=360; lastA=a; move(dd); });
  const end=()=>{ if(!dragging) return; dragging=false; lastA=null; j.classList.remove('touch'); flush(); post('/jog', c.deck+' touch 0'); };
  j.addEventListener('pointerup',end); j.addEventListener('pointercancel',end); j.addEventListener('lostpointercapture',end);
  // scroll wheel = nudge the platter edge (pitch bend), no touch
  el.addEventListener('wheel',ev=>{ ev.preventDefault(); let dy=ev.deltaY;
    if(ev.deltaMode===1)dy*=16; else if(ev.deltaMode===2)dy*=400; move(Math.max(-30,Math.min(30,dy/4))); },{passive:false});
  el.append(j); el.title='JOG — drag the platter (touch + scratch), scroll to nudge'; return el;
}
// Level meter: 12 segments, bit i of the 16-bit LE field = segment i (bottom up).
function meterCell(id){ const c=C[id]; const el=d('metercell'); const m=d('meter'); const segs=[];
  for(let i=0;i<12;i++){ const s=document.createElement('i'); m.prepend(s); segs.push(s); }   // segs[i] = bit i, bottom-up
  METERS.push({segs,b:c.meter}); el.append(m); el.title=c.l+' level'; return el; }
function meterBankCell(id){ const c=C[id]; const el=d('meterbank');
  c.ids.forEach(m=>el.appendChild(cap(m==='meterM'?'MST':C[m].l)));
  c.ids.forEach(m=>el.appendChild(meterCell(m)));
  const lv=cap(c.l); lv.classList.add('lv'); el.appendChild(lv);
  el.title='LEVEL — CH1 / MASTER / CH2'; return el; }
function cell(id){ const c=C[id]; if(!c) return d();
  switch(c.t){ case 'knob':return knobCell(id); case 'vfader':case 'vfader-c':return faderCell(id);
    case 'xfader':return xfaderCell(id); case 'selector':return selectorCell(id);
    case 'counter':return counterCell(id); case 'switch':return switchCell(id);
    case 'encoder':return encoderCell(id); case 'jog':return jogCell(id); case 'meter':return meterCell(id); case 'meterbank':return meterBankCell(id);
    default:return btnCell(id); } }

// ===== build (absolute placement) =========================================
function build(){
  const stage=document.getElementById('stage');
  const place=(el,x,y,w,h)=>{ Object.assign(el.style,{left:x+'%',top:y+'%',width:w+'%',height:h+'%'}); stage.appendChild(el); return el; };
  for(const z of ZONES) place(d('pbg'),...z);
  place(d('pbg disp'),...DISP);
  place(d('bezel'),...pctBox([SCREEN_U[0]-8,SCREEN_U[1]-8,SCREEN_U[2]+16,SCREEN_U[3]+16]));
  for(const [t,x,y] of LABELS){ const e=d('lbl'); e.textContent=t; e.style.left=x+'%'; e.style.top=y+'%'; stage.appendChild(e); }
  for(const id in COORDS){ const b=COORDS[id]; if(!C[id]) continue;
    const box=place(d('hs'),...b); box.appendChild(cell(id)); }
  const sc=d(''); sc.id='screen'; place(sc,SCREEN0.x,SCREEN0.y,SCREEN0.w,SCREEN0.h);
}

// ===== live screen ========================================================
const VNC=new URLSearchParams(location.search).get('vnc');
const conn=document.getElementById('conn');
let rfb=null;
async function startScreen(){
  const host=document.getElementById('screen'); if(!host) return;
  if(VNC){ let RFB; try{ ({default:RFB}=await import('/novnc/core/rfb.js')); }
    catch(e){ conn.textContent='screen: noVNC load failed'; return; }
    const connect=()=>{ conn.className='conn'; conn.textContent='screen: connecting…';
      rfb=new RFB(host,VNC); rfb.viewOnly=true; rfb.scaleViewport=true; rfb.clipViewport=false; rfb.background='#000';
      rfb.addEventListener('connect',()=>{ conn.className='conn up'; conn.textContent='screen: live'; });
      rfb.addEventListener('disconnect',()=>{ conn.className='conn'; conn.textContent='screen: no QEMU'; setTimeout(connect,1000); }); };
    connect();
  } else {
    const cv=document.createElement('canvas'); cv.width=800; cv.height=480; host.appendChild(cv); const cx=cv.getContext('2d'); let img=null;
    const pump=async()=>{ try{ const r=await fetch('/raw?t='+Date.now(),{cache:'no-store'}); if(!r.ok) throw 0;
      const w=+r.headers.get('X-Width')||800,h=+r.headers.get('X-Height')||480; const buf=new Uint8Array(await r.arrayBuffer());
      if(cv.width!==w||cv.height!==h){ cv.width=w; cv.height=h; img=null; }
      if(!img) img=cx.createImageData(w,h); const o=img.data,n=w*h;
      for(let i=0,j=0;i<n;i++){ o[j++]=buf[i*3]; o[j++]=buf[i*3+1]; o[j++]=buf[i*3+2]; o[j++]=255; }
      cx.putImageData(img,0,0); conn.className='conn up'; conn.textContent='screen: live'; requestAnimationFrame(pump);
    }catch(e){ conn.className='conn'; conn.textContent='screen: no QEMU'; setTimeout(pump,700); } };
    pump();
  }
}

// ===== LEDs / meters (rbp -> panel MCU SubTxData, QEMU patch 15) =========
// The server streams rbp's 20-byte LED payload as hex over SSE (/leds). Map:
// docs/subucom-led-map.md. Blinking is rbp's own doing (it toggles the bit), so we
// just mirror the bits.
const LEDS=[], METERS=[], JOGLEDS=[];
const STEADY_HOLD_MS=550;
function applyLeds(hex){ if(!hex||hex.length<40) return;
  const B=new Uint8Array(20); for(let i=0;i<20;i++) B[i]=parseInt(hex.substr(i*2,2),16);
  for(const L of LEDS){ const on=!!(B[L.b]&L.m)!==L.low;
    if(!L.steady){ L.el.classList.toggle('lit',on); continue; }
    // steady: light on any 'on' phase, drop only after the bit stays off longer than
    // rbp's blink half-period (~0.31 s measured; blink period ~0.62 s)
    if(on){ clearTimeout(L.t); L.t=null; L.el.classList.add('lit'); }
    else if(L.el.classList.contains('lit') && !L.t) L.t=setTimeout(()=>{ L.t=null; L.el.classList.remove('lit'); },STEADY_HOLD_MS); }
  for(const M of METERS){ const v=B[M.b]|(B[M.b+1]<<8); M.segs.forEach((s,i)=>s.classList.toggle('on',!!(v>>i&1))); }
  for(const J of JOGLEDS){ const v=B[J.b];
    if(v>=1&&v<=36){ const a=(v-1)*10; J.el.style.background=`conic-gradient(from ${a-5}deg,#ff9a2e 0 10deg,transparent 10deg 360deg)`; J.el.classList.add('on'); }
    else if(v===0){ J.el.style.background='#ff9a2e'; J.el.classList.add('on'); }
    else J.el.classList.remove('on'); }
}
function startLeds(){ if(!window.EventSource) return;
  const es=new EventSource('/leds'); es.onmessage=e=>applyLeds(e.data);
  es.onerror=()=>{ /* EventSource auto-reconnects */ }; }

// ===== dev calibration overlay (never shipped; ?cal=1 and XDJ_CAL_REF set) =
function calOverlay(){
  const q=new URLSearchParams(location.search); if(!q.has('cal')) return;
  const op=parseFloat(q.get('cal'))||0.45;
  const img=document.createElement('img'); img.src='/cal-ref';
  Object.assign(img.style,{position:'absolute',inset:'0',width:'100%',height:'100%',
    objectFit:'fill',opacity:String(op),pointerEvents:'none',zIndex:'99'});
  const stage=document.getElementById('stage'); stage.appendChild(img);
  addEventListener('keydown',e=>{ if(e.key==='='||e.key==='+') img.style.opacity=Math.min(1,parseFloat(img.style.opacity)+0.1);
    else if(e.key==='-') img.style.opacity=Math.max(0,parseFloat(img.style.opacity)-0.1);
    else if(e.key==='o') img.style.display=img.style.display==='none'?'block':'none'; });
}

// ===== init ===============================================================
// ---- pop-out screen: the same page in screen-only mode (?screen=1), view-only --------------
const SCREEN_ONLY=new URLSearchParams(location.search).has('screen');
async function popScreen(){
  const url=location.origin+'/?screen=1'+(VNC?'&vnc='+encodeURIComponent(VNC):'');
  const T=window.__TAURI__;
  if(T&&T.webviewWindow){   // desktop app: a native Tauri window (window.open is a no-op in WKWebView)
    try{ const W=T.webviewWindow.WebviewWindow; const ex=await W.getByLabel('screen');
      if(ex){ await ex.setFocus(); return; }
      const w=new W('screen',{url,title:'XDJ-RX Screen',width:SCREEN_FB[0],height:SCREEN_FB[1],minWidth:320,minHeight:192,resizable:true});
      w.once('tauri://error',e=>log('screen window failed: '+JSON.stringify(e.payload)));
    }catch(e){ log('screen window failed: '+e); }
    return; }
  const w=window.open(url,'xdj-screen','popup,width=800,height=480'); if(w) w.focus(); else log('pop-up blocked');
}
const SCREEN_FB=[800,480];   // the LCD framebuffer; the app locks the window to this natively
function initScreenOnly(){ document.title='XDJ-RX Screen'; document.body.classList.add('screenonly');
  const sc=d(''); sc.id='screen'; document.body.appendChild(sc); startScreen();
  // Browser pop-up: browsers can't lock the aspect during a drag, so snap the height to the
  // framebuffer aspect once a resize settles (resizeBy is allowed on script-opened pop-ups).
  if(!window.__TAURI__ && window.opener){ let t=null;
    addEventListener('resize',()=>{ clearTimeout(t); t=setTimeout(()=>{
      const want=Math.round(innerWidth*SCREEN_FB[1]/SCREEN_FB[0]);
      if(Math.abs(want-innerHeight)>2) try{ resizeBy(0,want-innerHeight); }catch(_){} },200); }); } }

function init(){
  if(SCREEN_ONLY) return initScreenOnly();   // no controls: never pushes state or holds
  if(!Kn) log('Knobs library failed to load (/knobs/knobs.js)');
  document.getElementById('popscr').addEventListener('click',popScreen);
  build(); startScreen(); calOverlay(); startLeds();
  document.getElementById('src0').addEventListener('click',()=>toggleSrc(0));
  document.getElementById('src1').addEventListener('click',()=>toggleSrc(1));
  document.getElementById('brel').addEventListener('click',()=>{ release(''); mainkeyRelease();
    document.querySelectorAll('.btn.down,.encpush.down').forEach(e=>e.classList.remove('down')); log('⏹ release all'); });
  setSrc(0,'DECK'); setSrc(1,'DECK');
  pushInitialState();
}
// Send every analog/switch control's starting value once, so the emulator matches
// what the panel shows (otherwise an untouched control sits at the boot default).
function pushInitialState(){ const lines=[];
  for(const id in C){ const c=C[id];
    if(c.t==='vfader-c' && c.specNeg){ const v=c.v==null?512:c.v; lines.push(c.specNeg+' '+v.toString(16), c.specPos+' '+(1023-v).toString(16)); }
    else if(isAnalog(c.spec) && c.v!=null && c.t!=='counter') lines.push(c.spec+' '+Math.round(c.v).toString(16));
    else if(c.t==='switch') lines.push(swLine(c,c.bits[c.v||0]));
    else if(c.t==='selector') lines.push(swLine(c,c.bitsOf(c.v||0)));
  }
  if(lines.length) post('/ctrl', lines.join('\n'));
}
init();
