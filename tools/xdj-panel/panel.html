<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>XDJ-RX panel</title>
<!-- Knobs/faders: MIT-licensed "audio-knobs" (HowdyMoto/Knobs), served from /knobs/
     (npm: app/ui/node_modules/audio-knobs/dist). Pure SVG, no deps. -->
<script src="/knobs/knobs.js"></script>
<style>
  :root{
    --bg:#0a0b0d; --panel:#131519; --panel2:#171a1f; --deck:#14171c; --edge:#262a31;
    --edge2:#333945; --ink:#e8ebf0; --dim:#8b94a1; --accent:#39b3ff; --accent2:#4ecdc4;
    --ok:#39d98a; --red:#e5484d; --amber:#e0a63a; --purp:#b06bff;
  }
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(1400px 700px at 50% -8%, #15181d 0%, var(--bg) 62%);
    color:var(--ink);font:13px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    -webkit-user-select:none;user-select:none}
  .bar{display:flex;align-items:center;gap:10px;padding:9px 16px;background:var(--panel);
    border-bottom:1px solid var(--edge);position:sticky;top:0;z-index:50;flex-wrap:wrap}
  .bar h1{font-size:13px;margin:0;letter-spacing:2px;font-weight:800;color:#cdd3db}
  .bar h1 b{color:var(--accent)}
  .bar .sp{flex:1}
  .conn{font-size:11px;padding:3px 10px;border-radius:20px;border:1px solid var(--edge);color:var(--red)}
  .conn.up{color:var(--ok);border-color:#2a6b4f}
  .tgl{appearance:none;border:1px solid var(--edge2);background:#1b1f26;color:var(--ink);
    border-radius:7px;padding:6px 11px;font-size:11px;font-weight:700;cursor:pointer;letter-spacing:.3px}
  .tgl.deck{background:#13303f;border-color:#2a6b8f;color:#bfe3ff}
  .tgl.line{background:#3a2f1e;border-color:#6b572e;color:#ffe0a8}
  .tgl.red{background:#3a1e1f;border-color:#6b2e30;color:#ffb4b6}

  /* overall rig */
  .rig{max-width:1600px;margin:0 auto;padding:14px}
  .topstrip{display:flex;align-items:stretch;gap:10px;flex-wrap:wrap;
    background:linear-gradient(180deg,var(--panel2),#101216);border:1px solid var(--edge);
    border-radius:14px;padding:12px;margin-bottom:12px}
  .screenz{flex:1 1 360px;min-width:320px;display:flex;align-items:center;justify-content:center}
  .screenwrap{background:#000;border:1px solid var(--edge2);border-radius:10px;overflow:hidden;
    aspect-ratio:800/480;width:100%;max-width:520px;box-shadow:0 8px 30px #0008}
  #screen{width:100%;height:100%}
  #screen canvas{width:100%!important;height:100%!important;display:block}
  .main{display:grid;grid-template-columns:minmax(300px,1fr) minmax(420px,1.25fr) minmax(300px,1fr);
    gap:12px;align-items:start}
  @media(max-width:1180px){ .main{grid-template-columns:1fr} }
  .deck,.mixer{background:linear-gradient(180deg,var(--deck),#0f1115);border:1px solid var(--edge);
    border-radius:14px;padding:12px;min-width:0}
  .dh{font-size:11px;font-weight:800;letter-spacing:2px;color:var(--accent);margin:0 2px 10px}
  .dh.r{color:var(--accent2);text-align:right}

  /* clusters */
  .zone{background:var(--panel2);border:1px solid var(--edge);border-radius:10px;padding:8px 9px;
    display:flex;flex-direction:column;gap:6px}
  .gt{font-size:8.5px;letter-spacing:1.4px;color:var(--dim);font-weight:700;text-transform:uppercase}
  .clrow{display:flex;flex-wrap:wrap;gap:7px;align-items:flex-end}
  .clrow.col{flex-direction:column;align-items:center}
  .clrow.ctr{justify-content:center}

  /* deck internal */
  .deckmid{display:flex;gap:8px;align-items:stretch;margin:8px 0}
  .deckmid .edge,.deckmid .side{flex:0 0 auto}
  .deckmid .jogz{flex:1 1 auto;display:flex;align-items:center;justify-content:center;
    background:var(--panel2);border:1px solid var(--edge);border-radius:12px;padding:6px}
  .deckmid .tempoz{flex:0 0 auto;background:var(--panel2);border:1px solid var(--edge);
    border-radius:10px;padding:8px 6px;display:flex;align-items:center;justify-content:center}
  .deckbot{display:flex;gap:8px;align-items:stretch}
  .deckbot .trans{flex:0 0 auto}
  .deckbot .padwrap{flex:1 1 auto;display:flex;flex-direction:column;gap:6px}

  /* mixer internal */
  .mixgrid{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:start;margin-bottom:8px}
  .chcol{display:flex;flex-direction:column;gap:7px;align-items:center;background:var(--panel2);
    border:1px solid var(--edge);border-radius:10px;padding:8px 6px}
  .chcol .cn{font-size:10px;font-weight:800;letter-spacing:1px;color:var(--dim)}
  .midfx{display:flex;flex-direction:column;gap:7px}
  .faders{display:grid;grid-template-columns:auto 1fr 1fr auto;gap:8px;align-items:end;
    background:var(--panel2);border:1px solid var(--edge);border-radius:10px;padding:8px;margin-bottom:8px}
  .xfrow{display:flex;flex-direction:column;gap:5px;background:var(--panel2);border:1px solid var(--edge);
    border-radius:10px;padding:9px 10px}

  /* widgets */
  .w{display:flex;flex-direction:column;align-items:center;gap:3px}
  .wlab{font-size:8px;letter-spacing:.3px;color:var(--dim);font-weight:700;text-align:center;
    max-width:76px;line-height:1.1}
  /* buttons */
  .pad{appearance:none;cursor:pointer;color:#cdd3db;background:linear-gradient(180deg,#232832,#191d24);
    border:1px solid var(--edge2);border-radius:7px;padding:0 8px;min-width:38px;height:28px;
    font-size:9px;font-weight:700;letter-spacing:.2px;display:inline-flex;align-items:center;
    justify-content:center;text-align:center;line-height:1.05;transition:.06s;box-shadow:0 1px 0 #0006 inset}
  .pad:hover{border-color:#49515e;color:#fff}
  .pad:active,.pad.down{background:linear-gradient(180deg,#1b4a63,#123246);border-color:var(--accent);
    color:#eaf6ff;box-shadow:0 0 9px #39b3ff55, 0 1px 0 #0006 inset}
  .pad.round{border-radius:50%;width:44px;height:44px;min-width:0;padding:0;font-size:9px}
  .pad.big{height:44px;min-width:56px;font-size:10px}
  .pad.play.down,.pad.play:active{background:linear-gradient(180deg,#1b633a,#123a24);border-color:var(--ok);box-shadow:0 0 10px #39d98a66}
  .pad.hotpad{height:44px;min-width:54px;font-size:13px;background:linear-gradient(180deg,#2a2433,#1c1824);border-color:#4a3a63;color:#d9c7ef}
  .pad.hotpad:active,.pad.hotpad.down{background:linear-gradient(180deg,#5a2b7a,#3a1c52);border-color:var(--purp);color:#fff;box-shadow:0 0 10px #b06bff66}
  .pad.unmapped{opacity:.45;border-style:dashed}
  /* crossfader */
  input[type=range].xf{-webkit-appearance:none;appearance:none;width:100%;height:10px;border-radius:6px;
    background:#20242b;border:1px solid var(--edge2);outline:none;margin:2px 0}
  input[type=range].xf::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:26px;border-radius:5px;
    background:linear-gradient(180deg,#cfd6df,#8b94a1);border:1px solid #0008;cursor:ew-resize}

  /* log */
  .logwrap{max-width:1600px;margin:0 auto;padding:10px 16px 20px}
  #logbox{height:64px;overflow:auto;background:#0b0d10;border:1px solid var(--edge);border-radius:8px;
    padding:6px 9px;font:11px/1.45 ui-monospace,Menlo,monospace;color:#9aa7b4;white-space:pre-wrap}
</style>
</head>
<body>
<div class="bar">
  <h1>PIONEER <b>XDJ-RX</b> · VIRTUAL PANEL</h1>
  <span id="conn" class="conn">screen: …</span>
  <span class="sp"></span>
  <button class="tgl deck" id="src0" title="CH1 input source (DECK / LINE·PHONO)">CH1: DECK</button>
  <button class="tgl deck" id="src1" title="CH2 input source (DECK / LINE·PHONO)">CH2: DECK</button>
  <button class="tgl red" id="brel">Release all</button>
</div>

<div class="rig">
  <!-- TOP STRIP: usb1/mic | sources | SCREEN | utils | master/rec | usb2 -->
  <div class="topstrip">
    <div class="zone" id="z_usb1"></div>
    <div class="zone" id="z_mic"></div>
    <div class="zone" id="z_src"></div>
    <div class="screenz"><div class="screenwrap"><div id="screen"></div></div></div>
    <div class="zone" id="z_util"></div>
    <div class="zone" id="z_master"></div>
    <div class="zone" id="z_usb2"></div>
  </div>
  <!-- MAIN: deck 1 | mixer | deck 2 -->
  <div class="main">
    <div class="deck"><div class="dh">DECK 1</div><div id="deck1"></div></div>
    <div class="mixer"><div id="mixer"></div></div>
    <div class="deck"><div class="dh r">DECK 2</div><div id="deck2"></div></div>
  </div>
</div>

<div class="logwrap"><div id="logbox"></div></div>

<script>

  {id:'hp_lvl', label:'HP LEVEL', type:'knob', spec:'A 4c', val:512},
  {id:'booth', label:'BOOTH', type:'knob', spec:'A 48', val:512},
  {id:'masterlvl', label:'MASTER', type:'knob', spec:'A 50', val:512},
  {id:'deck1src', label:'CH1 PH/LN', type:'btn', gpio:119},
  {id:'deck2src', label:'CH2 PH/LN', type:'btn', gpio:120},

  {id:'mic2', label:'MIC 2', type:'knob', spec:'A 46', val:512},
  {id:'miceqhi', label:'HI', type:'knob', spec:null, val:512},
  {id:'miceqlow', label:'LOW', type:'knob', spec:null, val:512},
  {id:'micsw', label:'MIC', type:'btn', spec:null},

  {id:'scfx_filter', label:'FILTER', type:'btn', spec:null},
  {id:'xfcurve', label:'XF CURVE', type:'btn', spec:null},
];
const CMAP = Object.fromEntries(CTRLS.map(c=>[c.id,c]));

// ================= server I/O (unchanged protocol) =========================
const logbox=document.getElementById('logbox');
function log(m){ const t=new Date().toLocaleTimeString();
  logbox.textContent=`[${t}] ${m}\n`+logbox.textContent;
  if(logbox.textContent.length>4000) logbox.textContent=logbox.textContent.slice(0,4000); }
async function post(p,b){ try{ await fetch(p,{method:'POST',body:b||''}); }catch(e){ log('POST '+p+' failed'); } }
function ctrl(spec){ post('/ctrl',spec); }
function release(){ post('/release'); }
function mainkey(n){ post('/mainkey',String(n)); }
function mainkeyRelease(){ post('/mainkey_release'); }
const _src={0:'DECK',1:'DECK'};
function _srcUI(ch){ const b=document.getElementById('src'+ch); if(!b) return; const s=_src[ch];
  b.textContent='CH'+(ch+1)+': '+s; b.classList.toggle('deck',s==='DECK'); b.classList.toggle('line',s==='LINE'); }
function setSrc(ch,s){ _src[ch]=s; _srcUI(ch); post('/input', ch+' '+s); log('CH'+(ch+1)+' input: '+s); }
function toggleSrc(ch){ setSrc(ch, _src[ch]==='DECK'?'LINE':'DECK'); }
const isAnalog=s=>!!s && /^a /i.test(s);

// ================= widgets =================================================
const Kn = window.Knobs;
const KS={showValueDisplay:false,showTicks:true,tickCount:11,fontFamily:'inherit',
  dialColor:'#20242b',bezelColor:'#30353d',indicatorColor:'#39b3ff',tickColor:'#4a515b'};
function lw(c,node,cls){ const w=document.createElement('div'); w.className='w '+(cls||'');
  w.appendChild(node); if(c.label){ const l=document.createElement('div'); l.className='wlab';
  l.textContent=c.label; w.appendChild(l); } return w; }

function buildKnob(c,size){ const m=document.createElement('div');
  try{ const k=new Kn.Knob(m,Object.assign({},KS,{mode:'bounded',min:0,max:1023,value:(c.val==null?512:c.val),size:size||46}));
    if(isAnalog(c.spec)) k.onChange(e=>ctrl(c.spec+' '+Math.round(e.value).toString(16)));
  }catch(e){ m.textContent='⊘'; } return lw(c,m,'knobw'); }

function buildFader(c,len){ const m=document.createElement('div'); const center=c.type==='vfader-c';
  try{ const s=new Kn.Slider(m,{min:0,max:1023,value:(c.val==null?(center?512:0):c.val),
      length:len||130,width:28,showTicks:center,tickCount:center?9:0,showValueDisplay:false,
      trackColor:'#20242b',thumbColor:'#c7ced8',tickColor:'#4a515b',labelColor:'#8b94a1',fontFamily:'inherit'});
    if(center && c.specNeg && c.specPos){
      s.onChange(e=>{ const lo=Math.round(e.value), hi=1023-lo;      // top=−, bottom=+
        ctrl(c.specNeg+' '+lo.toString(16)+'\n'+c.specPos+' '+hi.toString(16)); });
    } else if(isAnalog(c.spec)){ s.onChange(e=>ctrl(c.spec+' '+Math.round(e.value).toString(16))); }
  }catch(e){ m.textContent='⊘'; } return lw(c,m,'faderw'); }

function buildXfader(c){ const w=document.createElement('div'); w.className='w'; w.style.width='100%';
  const r=document.createElement('input'); r.type='range'; r.min=0; r.max=1023; r.step=1;
  r.value=(c.val==null?512:c.val); r.className='xf';
  if(isAnalog(c.spec)) r.addEventListener('input',()=>ctrl(c.spec+' '+(+r.value).toString(16)));
  const l=document.createElement('div'); l.className='wlab'; l.textContent=c.label;
  w.appendChild(r); w.appendChild(l); return w; }

// Endless encoder (jog / fx-select / browse): angle degrees -> detents (20/rev).
function buildEncoder(c,onDetent,size){ const m=document.createElement('div');
  let last=null, acc=0, t=0;
  try{ const k=Kn.createInfiniteKnob(m,Object.assign({},KS,{size:size||54,gripBumps:true,gripBumpCount:20,showTicks:false}));
    k.onChange(e=>{ if(last==null){last=e.angle;return;} let d=e.angle-last;
      if(d>180)d-=360; if(d<-180)d+=360; last=e.angle; acc+=d; const now=performance.now();
      while(acc>=18){ acc-=18; if(now-t>30){ onDetent(1); t=now; } }
      while(acc<=-18){ acc+=18; if(now-t>30){ onDetent(-1); t=now; } } });
  }catch(e){ m.textContent='⊘'; } return lw(c,m,'encw'); }

function buildButton(c){ const b=document.createElement('button');
  const mapped=!!(c.spec||c.gpio);
  b.className='pad'+(c.big?' big':'')+(c.round?' round':'')+(c.kind==='hot'?' hotpad':'')
    +(c.kind==='play'?' play':'')+(mapped?'':' unmapped');
  b.textContent=c.label; b.title=c.label+(mapped?'':'  (unmapped)');
  let lp=null;
  b.addEventListener('pointerdown',e=>{ e.preventDefault();
    if(c.gpio){ b.classList.add('down'); mainkey(c.gpio); log('▸ '+c.label+' gpio '+c.gpio); return; }
    if(!c.spec){ log('· '+c.label+' — unmapped'); return; }
    b.classList.add('down'); ctrl(c.spec);
    if(c.longpress){ lp=setTimeout(()=>ctrl('B '+c.spec.replace(/^[bB] /,'')),1100); }
    log('▸ '+c.label+'  '+c.spec); });
  const up=()=>{ if(c.gpio){ b.classList.remove('down'); mainkeyRelease(); return; }
    if(c.spec){ if(lp){clearTimeout(lp);lp=null;} b.classList.remove('down'); release(); } };
  b.addEventListener('pointerup',up);
  b.addEventListener('pointerleave',()=>{ if(b.classList.contains('down')) up(); });
  if(c.browseWheel){ let wa=0,wt=null; const STEP=80,CAP=3;
    b.addEventListener('wheel',ev=>{ ev.preventDefault(); let dy=ev.deltaY;
      if(ev.deltaMode===1)dy*=16; else if(ev.deltaMode===2)dy*=400; wa+=dy;
      if(!wt){ wt=setTimeout(()=>{ wt=null; let s=Math.max(-CAP,Math.min(CAP,Math.trunc(wa/STEP)));
        if(s){ wa-=s*STEP; post('/browse',String(s)); } else if(Math.abs(wa)>STEP*4){ wa=0; } },70); }
    },{passive:false}); } return b; }

function widget(id,size){ const c=CMAP[id]; if(!c) return document.createComment('missing '+id);
  if(c.type==='knob') return buildKnob(c,size);
  if(c.type==='vfader'||c.type==='vfader-c') return buildFader(c,size);
  if(c.type==='hfader') return buildXfader(c);
  if(c.type==='rotary') return buildEncoder(c, d=>{ const s=d>0?c.specUp:c.specDown; if(s) ctrl(s); },
     id.indexOf('jog')>=0?150:54);
  return buildButton(c); }

// ---- layout helpers ----
function zone(host,title,ids,opts){ opts=opts||{};
  const z=document.createElement('div'); z.className='zone';
  if(title){ const t=document.createElement('div'); t.className='gt'; t.textContent=title; z.appendChild(t); }
  const r=document.createElement('div'); r.className='clrow'+(opts.col?' col':'')+(opts.ctr?' ctr':'');
  for(const id of ids){ r.appendChild(widget(id,opts.size)); }
  z.appendChild(r); host.appendChild(z); return z; }
function row(cls){ const d=document.createElement('div'); d.className=cls; return d; }
function cl(ids,{title,col,ctr,size}={}){ const g=document.createElement('div');
  const r=document.createElement('div'); r.className='clrow'+(col?' col':'')+(ctr?' ctr':'');
  for(const id of ids) r.appendChild(widget(id,size));
  if(title){ const t=document.createElement('div'); t.className='gt'; t.textContent=title;
    g.appendChild(t); } g.appendChild(r); return g; }

// ================= render (hardware-like layout) ===========================
function renderDeck(host,d){ const P='d'+d;
  // top: loop + call/memory/delete + search/track
  zone(host,'Loop / Hot cue call',[P+'in',P+'out',P+'reloop',P+'_call_l',P+'_call_r',P+'_memory',P+'_delete']);
  // middle: edge column | jog | side column | tempo fader
  const mid=row('deckmid');
  const edge=document.createElement('div'); edge.className='zone edge';
  edge.appendChild(cl([P+'_rev',P+'slip'],{col:true}));
  edge.appendChild(cl([P+'_tsL',P+'_tsR'],{title:'Track',col:false}));
  edge.appendChild(cl([P+'_srchL',P+'_srchR'],{title:'Search',col:false}));
  edge.appendChild(cl([P+'_jogmode',P+'_vinyladj'],{col:true}));
  mid.appendChild(edge);
  const jz=document.createElement('div'); jz.className='jogz'; jz.appendChild(widget(P+'jog')); mid.appendChild(jz);
  const side=document.createElement('div'); side.className='zone side';
  side.appendChild(cl([P+'sync',P+'_syncmaster',P+'_mastertempo'],{col:true}));
  side.appendChild(cl([P+'trng'],{col:true}));
  mid.appendChild(side);
  const tz=document.createElement('div'); tz.className='tempoz'; tz.appendChild(widget(P+'tempo',150)); mid.appendChild(tz);
  host.appendChild(mid);
  // bottom: transport (play/cue) + performance pads
  const bot=row('deckbot');
  const trans=document.createElement('div'); trans.className='zone trans';
  trans.appendChild(cl([P+'play',P+'cue'],{col:true}));
  bot.appendChild(trans);
  const pw=document.createElement('div'); pw.className='padwrap';
  const modez=document.createElement('div'); modez.className='zone';
  modez.appendChild(cl([P+'_hotcuemode',P+'auto',P+'_loopslice',P+'shift'],{title:'Pad mode'}));
  const padz=document.createElement('div'); padz.className='zone';
  padz.appendChild(cl([P+'h1',P+'h2',P+'h3',P+'h4'],{title:'Performance pads'}));
  pw.appendChild(modez); pw.appendChild(padz); bot.appendChild(pw);
  host.appendChild(bot);
}

function renderMixer(host){
  // browse row (sits under the screen)
  const bz=document.createElement('div'); bz.className='zone';
  const bt=document.createElement('div'); bt.className='gt'; bt.textContent='Browse'; bz.appendChild(bt);
  const br=document.createElement('div'); br.className='clrow ctr';
  br.appendChild(widget('back'));
  br.appendChild(buildEncoder({id:'browse_enc',label:'SELECT · PUSH'}, d=>post('/browse',String(d)), 64));
  br.appendChild(widget('enc'));
  for(const id of ['taglist','info','menu','tagtrk','loadL','loadR']) br.appendChild(widget(id));
  bz.appendChild(br); host.appendChild(bz);

  // channel strips + center FX
  const grid=row('mixgrid');
  const mkChan=(n)=>{ const col=document.createElement('div'); col.className='chcol';
    const cn=document.createElement('div'); cn.className='cn'; cn.textContent='CH '+n; col.appendChild(cn);
    col.appendChild(widget('deck'+n+'src'));
    col.appendChild(widget('trim'+n)); col.appendChild(widget('eq_hi'+n));
    col.appendChild(widget('eq_mid'+n)); col.appendChild(widget('eq_low'+n));
    col.appendChild(widget('color'+n)); return col; };
  grid.appendChild(mkChan(1));
  const mid=document.createElement('div'); mid.className='midfx';
  const fx=document.createElement('div'); fx.className='zone';
  fx.appendChild(cl([],{title:'Beat FX'}));
  fx.appendChild(cl(['beatL','beatR','fxtap'],{ctr:true}));
  fx.appendChild(cl(['fxsel','fxch'],{ctr:true}));
  fx.appendChild(cl(['fxlev','fxtime'],{ctr:true}));
  fx.appendChild(cl(['fxon'],{ctr:true}));
  mid.appendChild(fx);
  const scfx=document.createElement('div'); scfx.className='zone';
  scfx.appendChild(cl(['scfx_noise','scfx_gate','scfx_crush','scfx_filter'],{title:'Sound Color FX'}));
  mid.appendChild(scfx);
  const hp=document.createElement('div'); hp.className='zone';
  hp.appendChild(cl(['hp_mix','hp_lvl'],{title:'Headphones',ctr:true}));
  mid.appendChild(hp);
  grid.appendChild(mid);
  grid.appendChild(mkChan(2));
  host.appendChild(grid);

  // channel faders + cue
  const fz=row('faders');
  fz.appendChild(cl(['cue1'],{ctr:true}));
  fz.appendChild(widget('ch1',140));
  fz.appendChild(widget('ch2',140));
  fz.appendChild(cl(['cue2'],{ctr:true}));
  host.appendChild(fz);

  // crossfader
  const xz=row('xfrow');
  const xt=document.createElement('div'); xt.className='gt'; xt.textContent='Crossfader'; xz.appendChild(xt);
  xz.appendChild(widget('xf'));
  xz.appendChild(cl(['xfcurve'],{ctr:true}));
  host.appendChild(xz);
}

function render(){
  // top strip
  zone(document.getElementById('z_usb1'),'USB 1',['usb1stop']);
  zone(document.getElementById('z_mic'),'Mic',['mic1','mic2','miceqhi','miceqlow','micsw']);
  zone(document.getElementById('z_src'),'Source',['src_rb','src_midi','src_usb1','src_usb2'],{col:true});
  zone(document.getElementById('z_util'),'',['quant','deck12','timemd'],{col:true});
  zone(document.getElementById('z_master'),'Master / Booth',['masterlvl','booth','mrec','tmark']);
  zone(document.getElementById('z_usb2'),'USB 2',['usb2stop']);
  // decks + mixer
  renderDeck(document.getElementById('deck1'),'1');
  renderMixer(document.getElementById('mixer'));
  renderDeck(document.getElementById('deck2'),'2');
}

// ================= live screen (noVNC push, or /raw poll) ==================
const VNC=new URLSearchParams(location.search).get('vnc');
const conn=document.getElementById('conn');
let rfb=null, rawCv=null, rawCtx=null, imgData=null;
async function startScreen(){
  const host=document.getElementById('screen'); if(!host) return;
  if(VNC){
    let RFB; try{ ({default:RFB}=await import('/novnc/core/rfb.js')); }
    catch(e){ conn.textContent='screen: noVNC load failed'; return; }
    const connect=()=>{ conn.className='conn'; conn.textContent='screen: connecting…';
      rfb=new RFB(host,VNC); rfb.viewOnly=true; rfb.scaleViewport=true; rfb.clipViewport=false; rfb.background='#000';
      rfb.addEventListener('connect',()=>{ conn.className='conn up'; conn.textContent='screen: live'; });
      rfb.addEventListener('disconnect',()=>{ conn.className='conn'; conn.textContent='screen: no QEMU'; setTimeout(connect,1000); }); };
    connect();
  } else {
    rawCv=document.createElement('canvas'); rawCv.width=800; rawCv.height=480; host.appendChild(rawCv); rawCtx=rawCv.getContext('2d');
    const pump=async()=>{ try{ const r=await fetch('/raw?t='+Date.now(),{cache:'no-store'}); if(!r.ok) throw 0;
      const w=+r.headers.get('X-Width')||800,h=+r.headers.get('X-Height')||480;
      const buf=new Uint8Array(await r.arrayBuffer());
      if(rawCv.width!==w||rawCv.height!==h){ rawCv.width=w; rawCv.height=h; imgData=null; }
      if(!imgData) imgData=rawCtx.createImageData(w,h); const d=imgData.data,n=w*h;
      for(let i=0,j=0;i<n;i++){ d[j++]=buf[i*3]; d[j++]=buf[i*3+1]; d[j++]=buf[i*3+2]; d[j++]=255; }
      rawCtx.putImageData(imgData,0,0); conn.className='conn up'; conn.textContent='screen: live';
      requestAnimationFrame(pump);
    }catch(e){ conn.className='conn'; conn.textContent='screen: no QEMU'; setTimeout(pump,700); } };
    pump();
  }
}

// ================= init ====================================================
function init(){
  if(!Kn){ log('Knobs library failed to load (/knobs/knobs.js)'); }
  render(); startScreen();
  document.getElementById('src0').addEventListener('click',()=>toggleSrc(0));
  document.getElementById('src1').addEventListener('click',()=>toggleSrc(1));
  document.getElementById('brel').addEventListener('click',()=>{ release(); mainkeyRelease();
    document.querySelectorAll('.pad.down').forEach(e=>e.classList.remove('down')); log('⏹ release all'); });
  setSrc(0,'DECK'); setSrc(1,'DECK');
}
init();
