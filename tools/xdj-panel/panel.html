<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>XDJ-RX panel</title>
<style>
  :root{ --bg:#0c0e11; --ink:#e8ebf0; --dim:#9aa3af; --ok:#39d98a; --guess:#e0a63a;
         --red:#e5484d; --accent:#39b3ff; --edge:#2b2f36; --panel:#16181d; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:13px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  .bar{display:flex;align-items:center;gap:12px;padding:8px 14px;background:var(--panel);
    border-bottom:1px solid var(--edge);position:sticky;top:0;z-index:50;flex-wrap:wrap}
  .bar h1{font-size:14px;margin:0;letter-spacing:.5px;font-weight:700}
  .bar .sp{flex:1}
  .btn{appearance:none;border:1px solid var(--edge);background:#1e2127;color:var(--ink);
    border-radius:7px;padding:7px 11px;font-size:12px;font-weight:600;cursor:pointer}
  .btn:hover{border-color:#3a414b}
  .btn.on{background:#1c3a4d;border-color:#2a6b8f;color:#bfe3ff}
  .btn.red{background:#3a1e1f;border-color:#6b2e30;color:#ffb4b6}
  .conn{font-size:11px;padding:3px 9px;border-radius:20px;border:1px solid var(--edge);color:var(--red)}
  .conn.up{color:var(--ok);border-color:#2a6b4f}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .hint{color:var(--dim);font-size:11px}
  .stage-wrap{max-width:1240px;margin:0 auto;padding:14px}
  #stage{position:relative;width:100%;user-select:none;-webkit-user-select:none}
  #stage img#device{display:block;width:100%;height:auto;pointer-events:none}
  #noimg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    background:#111;border:1px dashed #444;border-radius:8px;text-align:center;padding:24px}
  /* live screen */
  #screen{position:absolute;background:#000;image-rendering:auto;}
  /* hotspots */
  .hs{position:absolute;transform:translate(-50%,-50%);border-radius:7px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;
    color:transparent;text-align:center;line-height:1;overflow:hidden;
    border:1px solid transparent;background:transparent;transition:background .05s,border-color .05s}
  .hs.round{border-radius:50%}
  .hs:hover{background:rgba(57,179,255,.16);border-color:rgba(57,179,255,.5)}
  .hs.down{background:rgba(57,217,138,.42)!important;border-color:var(--ok)!important}
  .hs.track{background:rgba(57,179,255,.05)}         /* faders show a faint track */
  .hs .fill{position:absolute;background:rgba(57,179,255,.55);pointer-events:none;border-radius:4px}
  .hs .ctick{position:absolute;left:0;right:0;top:50%;height:2px;margin-top:-1px;
    background:rgba(255,255,255,.4);pointer-events:none}
  /* calibration */
  body.cal .hs{border-color:rgba(224,166,58,.9);background:rgba(224,166,58,.14);
    color:#1a1407;font-size:8px;cursor:move}
  body.cal .hs.mapped{border-color:rgba(57,217,138,.9);background:rgba(57,217,138,.16)}
  body.cal .hs.unmapped{border-color:rgba(229,72,77,.9);background:rgba(229,72,77,.16)}
  body.cal #screen{outline:2px dashed var(--accent);cursor:move}
  #calhandle{position:absolute;width:16px;height:16px;right:-8px;bottom:-8px;background:var(--accent);
    border-radius:3px;cursor:nwse-resize;display:none}
  body.cal #calhandle{display:block}
  #log{max-width:1240px;margin:0 auto;padding:0 14px 20px}
  #logbox{height:92px;overflow:auto;background:#0b0d10;border:1px solid var(--edge);border-radius:6px;
    padding:6px 8px;font:11px/1.4 ui-monospace,Menlo,monospace;color:#b9c2cc;white-space:pre-wrap}
  .legend{display:flex;gap:16px;color:var(--dim);font-size:11px;margin:6px 2px}
  .dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:5px;vertical-align:middle}
  .dot.ok{background:var(--ok)} .dot.guess{background:var(--guess)} .dot.un{background:var(--red)}
</style>
</head>
<body>
<div class="bar">
  <h1>XDJ-RX · panel</h1>
  <span id="conn" class="conn">screen: …</span>
  <span id="fps" class="mono hint"></span>
  <span class="sp"></span>
  <span id="calhint" class="hint">Tip: press <b>C</b> or “Calibrate” to drag controls onto the photo, then Save.</span>
  <button class="btn" id="bcal">Calibrate</button>
  <button class="btn" id="bsave" style="display:none">Save layout</button>
  <button class="btn" id="breset" style="display:none">Reset</button>
  <button class="btn red" id="brel">Release all</button>
</div>

<div class="stage-wrap">
  <div id="stage">
    <img id="device" src="/assets/xdj-rx.png" alt="XDJ-RX"
         onerror="document.getElementById('noimg').style.display='flex'">
    <div id="noimg" style="display:none">
      <div><b>Device image missing.</b><br>
      Save your XDJ-RX photo to<br>
      <span class="mono">tools/xdj-panel/assets/xdj-rx.png</span><br>then reload.</div>
    </div>
    <canvas id="screen" width="800" height="480"></canvas>
    <div id="calhandle"></div>
    <!-- hotspots injected here -->
  </div>
</div>

<div id="log">
  <div class="legend">
    <span><span class="dot ok"></span>verified code</span>
    <span><span class="dot guess"></span>best-guess code</span>
    <span><span class="dot un"></span>unmapped (click logs it)</span>
  </div>
  <div id="logbox"></div>
</div>

// ---- state ----------------------------------------------------------------
let SCREEN = Object.assign({}, SCREEN0);
let CTRLS = CTRLS0.map(c=>Object.assign({}, c));
let calib = false;
const stage = document.getElementById('stage');
const logbox = document.getElementById('logbox');
function log(m){ const t=new Date().toLocaleTimeString();
  logbox.textContent = `[${t}] ${m}\n`+logbox.textContent;
  if(logbox.textContent.length>5000) logbox.textContent=logbox.textContent.slice(0,5000); }

async function post(p,b){ try{ await fetch(p,{method:'POST',body:b||''});}catch(e){ log('POST '+p+' failed'); } }
function ctrl(spec){ post('/ctrl',spec); }
function release(){ post('/release'); }
// MAIN-UCOM direct GPIO keys (USB1/USB2/rekordbox/MIDI) go through a separate
// channel (/tmp/mainkey) -- they are NOT subucom frame controls.
function mainkey(n){ post('/mainkey',String(n)); }
function mainkeyRelease(){ post('/mainkey_release'); }

// ---- build hotspots -------------------------------------------------------
const els = {};
function place(el,c){ el.style.left=c.cx+'%'; el.style.top=c.cy+'%';
  el.style.width=c.w+'%'; el.style.height=c.h+'%'; }
function gradeClass(c){ return (c.spec||c.gpio)? 'mapped' : 'unmapped'; }

function build(){
  Object.values(els).forEach(e=>e.remove());
  for(const c of CTRLS){
    const el=document.createElement('div');
    const mapped = !!(c.spec||c.specUp||c.specNeg||c.gpio);
    el.className='hs '+(c.shape==='round'?'round ':'')+(mapped?'mapped':'unmapped');
    el.dataset.id=c.id; el.textContent=c.label; place(el,c);
    el.title=c.label+(mapped?('  ['+(c.spec||(c.gpio?('gpio '+c.gpio):(c.specUp+' / '+c.specDown)))+']'):'  (unmapped)');
    if(c.type==='vfader'||c.type==='hfader'||c.type==='vfader-c'){ el.classList.add('track');
      if(c.type==='vfader-c'){ const t=document.createElement('div'); t.className='ctick'; el.appendChild(t); }
      const fill=document.createElement('div'); fill.className='fill'; el.appendChild(fill); el._fill=fill; drawFill(c,el); }
    stage.appendChild(el); els[c.id]=el; wire(el,c);
  }
  layoutScreen();
}
function drawFill(c,el){
  const v=(c.val==null?512:c.val)/1023;
  if(c.type==='vfader-c'){ // centered pitch fader: handle bar at position (top=−, bottom=+)
    el._fill.style.left='6%'; el._fill.style.width='88%'; el._fill.style.height='5%';
    el._fill.style.bottom='auto'; el._fill.style.top='calc('+(v*100).toFixed(1)+'% - 2.5%)'; }
  else if(c.type==='vfader'){ el._fill.style.left='30%'; el._fill.style.width='40%';
    el._fill.style.top='auto'; el._fill.style.bottom='0'; el._fill.style.height=(v*100).toFixed(1)+'%'; }
  else { el._fill.style.top='25%'; el._fill.style.height='50%';
    el._fill.style.left='0'; el._fill.style.width=(v*100).toFixed(1)+'%'; }
}

// ---- interaction ----------------------------------------------------------
function wire(el,c){
  let dragging=false, moved=false, startPx, startCxy, lpTimer=null;
  // Buttons fire a ONE-SHOT press (reliable short press; a sustained hold on some
  // controls e.g. the encoder push triggers the wrong mode). For controls with a
  // long-press function (longpress:true, e.g. MENU→UTILITY), if the user keeps the
  // button down past ~1.1s we additionally send a sustained hold to trigger it.
  const clearLp=()=>{ if(lpTimer){ clearTimeout(lpTimer); lpTimer=null; } };
  const onDown=e=>{
    e.preventDefault();
    if(calib){ // drag to reposition
      dragging=true; moved=false;
      const p=pt(e); startPx=p; startCxy={cx:c.cx,cy:c.cy};
      const mv=ev=>{ const q=pt(ev); const r=stage.getBoundingClientRect();
        c.cx=clamp(startCxy.cx+(q.x-startPx.x)/r.width*100,0,100);
        c.cy=clamp(startCxy.cy+(q.y-startPx.y)/r.height*100,0,100);
        place(el,c); moved=true; };
      const up=()=>{ document.removeEventListener('pointermove',mv);
        document.removeEventListener('pointerup',up); };
      document.addEventListener('pointermove',mv); document.addEventListener('pointerup',up);
      return;
    }
    // normal mode
    if(c.type==='btn'){
      if(c.browse){ el.classList.add('down'); post('/browse',String(c.browse)); setTimeout(()=>el.classList.remove('down'),120);
        log('↻ '+c.label+'  browse '+(c.browse>0?'+':'')+c.browse+' (rbp[0x54] counter)'); return; }
      if(c.gpio){ el.classList.add('down'); mainkey(c.gpio); log('▸ '+c.label+'  gpio '+c.gpio+' (MAIN-UCOM)'); return; }
      if(!c.spec){ log('· '+c.label+' — unmapped (no frame code yet)'); return; }
      // press WHILE held (like a real momentary button): send as a HOLD (B/A), released
      // on pointer-up. A quick click = short press; holding >1s = long press (e.g.
      // MENU→UTILITY). One-shot 'b'/'a' specs are promoted to holds 'B'/'A' on send.
      el.classList.add('down'); ctrl(c.spec);
      if(c.longpress){ lpTimer=setTimeout(()=>ctrl('B '+c.spec.replace(/^[bB] /,'')), 1100); }
      log('▸ '+c.label+'  '+c.spec); }
    else if(c.type==='rotary'){ // rotary encoder: spin -> one-shot step pulses
      if(!c.specUp){ log('· '+c.label+' — unmapped'); return; }
      const r=el.getBoundingClientRect(), cx0=r.left+r.width/2, cy0=r.top+r.height/2;
      let last=Math.atan2(e.clientY-cy0,e.clientX-cx0), acc=0, lastPulse=0, steps=0;
      const STEP=0.26;
      const mv=ev=>{ let a=Math.atan2(ev.clientY-cy0,ev.clientX-cx0), d=a-last;
        if(d>Math.PI)d-=2*Math.PI; if(d<-Math.PI)d+=2*Math.PI; last=a; acc+=d;
        const now=performance.now();
        while(acc>STEP){ acc-=STEP; if(now-lastPulse>35){ ctrl(c.specUp); lastPulse=now; steps++; } }
        while(acc<-STEP){ acc+=STEP; if(now-lastPulse>35){ ctrl(c.specDown); lastPulse=now; steps--; } } };
      const up=()=>{ document.removeEventListener('pointermove',mv); document.removeEventListener('pointerup',up);
        if(steps) log('↻ '+c.label+'  '+(steps>0?'+':'')+steps+' step'+(Math.abs(steps)>1?'s':'')); };
      document.addEventListener('pointermove',mv); document.addEventListener('pointerup',up);
    }
    else if(c.type==='vfader-c'){ // centre-detent pitch fader: complementary dual field
      const setFromEvent=ev=>{ const r=el.getBoundingClientRect(); const pos=clamp((pt(ev).y-r.top)/r.height,0,1);
        c.val=Math.round(pos*1023); drawFill(c,el);            // handle follows finger (top=−, bottom=+)
        const pct=Math.round((pos-0.5)*200);                   // −100…+100 % of selected tempo range
        const hi=Math.round(pos*1023), lo=1023-hi;             // specPos=hi (+side), specNeg=lo (−side)
        if(c.specNeg && c.specPos) ctrl(c.specNeg+' '+lo.toString(16)+'\n'+c.specPos+' '+hi.toString(16));
        el.title=c.label+'  '+(pct>0?'+':'')+pct+'% of range';
      };
      setFromEvent(e);
      const mv=ev=>setFromEvent(ev);
      const up=()=>{ document.removeEventListener('pointermove',mv); document.removeEventListener('pointerup',up); };
      document.addEventListener('pointermove',mv); document.addEventListener('pointerup',up);
    }
    else { // fader/knob: drag sets value
      const setFromEvent=ev=>{ const r=el.getBoundingClientRect(); const q=pt(ev); let v;
        if(c.type==='vfader'){ v=1-(q.y-r.top)/r.height; }
        else if(c.type==='hfader'){ v=(q.x-r.left)/r.width; }
        else { v=1-(q.y-r.top)/r.height; } // knob: vertical drag
        v=clamp(Math.round(v*1023),0,1023); c.val=v; drawFill(c,el);
        if(c.spec) ctrl(c.spec+' '+v.toString(16));
        el.title=c.label;
      };
      setFromEvent(e);
      const mv=ev=>setFromEvent(ev);
      const up=()=>{ document.removeEventListener('pointermove',mv);
        document.removeEventListener('pointerup',up); };
      document.addEventListener('pointermove',mv); document.addEventListener('pointerup',up);
    }
  };
  const onUp=()=>{ if(calib) return;
    if(c.type==='btn' && c.gpio){ el.classList.remove('down'); mainkeyRelease(); return; }
    if(c.type==='btn' && c.spec){ clearLp(); el.classList.remove('down'); release(); } };
  el.addEventListener('pointerdown',onDown);
  el.addEventListener('pointerup',onUp);
  el.addEventListener('pointerleave',()=>{ if(!calib && c.type==='btn' && el.classList.contains('down')){ clearLp(); el.classList.remove('down'); release(); }});
  // Browse ROTATE via mouse wheel / touchpad over the central encoder. Accumulate
  // scroll distance and emit one detent per WHEEL_STEP px (normalised across
  // deltaMode), batched so a touchpad's many tiny events don't over-scroll.
  if(c.browseWheel){ let wAcc=0, wT=null; const WHEEL_STEP=80, WHEEL_CAP=3;
    el.addEventListener('wheel',ev=>{ if(calib) return; ev.preventDefault();
      let dy=ev.deltaY; if(ev.deltaMode===1) dy*=16; else if(ev.deltaMode===2) dy*=400;
      wAcc+=dy;
      if(!wT){ wT=setTimeout(()=>{ wT=null;
        let s=Math.trunc(wAcc/WHEEL_STEP);
        s=Math.max(-WHEEL_CAP,Math.min(WHEEL_CAP,s));
        if(s){ wAcc-=s*WHEEL_STEP; post('/browse',String(s));
          log('↻ '+c.label+' wheel '+(s>0?'+':'')+s); }
        else if(Math.abs(wAcc)>WHEEL_STEP*4){ wAcc=0; } }, 70); }
    }, {passive:false}); }
}
function pt(e){ return {x:e.clientX, y:e.clientY}; }
function clamp(v,a,b){ return v<a?a:v>b?b:v; }

// ---- live screen ----------------------------------------------------------
const cv=document.getElementById('screen'), cx2=cv.getContext('2d'),
      conn=document.getElementById('conn'), fps=document.getElementById('fps');
function layoutScreen(){ cv.style.left=SCREEN.x+'%'; cv.style.top=SCREEN.y+'%';
  cv.style.width=SCREEN.w+'%'; cv.style.height=SCREEN.h+'%'; positionHandle(); }
let imgData=null, frames=0, lastFps=performance.now();
async function pump(){
  try{
    const r=await fetch('/raw?t='+Date.now(),{cache:'no-store'});
    if(!r.ok) throw 0;
    const w=+r.headers.get('X-Width')||800, h=+r.headers.get('X-Height')||480;
    const buf=new Uint8Array(await r.arrayBuffer());
    if(cv.width!==w||cv.height!==h){ cv.width=w; cv.height=h; imgData=null; }
    if(!imgData) imgData=cx2.createImageData(w,h);
    const d=imgData.data,n=w*h;
    for(let i=0,j=0;i<n;i++){ d[j++]=buf[i*3]; d[j++]=buf[i*3+1]; d[j++]=buf[i*3+2]; d[j++]=255; }
    cx2.putImageData(imgData,0,0);
    conn.className='conn up'; conn.textContent='screen: live';
    frames++; const now=performance.now();
    if(now-lastFps>1000){ fps.textContent=frames+' fps'; frames=0; lastFps=now; }
    requestAnimationFrame(pump);
  }catch(e){ conn.className='conn'; conn.textContent='screen: no QEMU'; setTimeout(pump,700); }
}

// ---- calibration: screen rect move/resize ---------------------------------
const handle=document.getElementById('calhandle');
function positionHandle(){ const r=cv.getBoundingClientRect(), s=stage.getBoundingClientRect();
  handle.style.left=(cv.offsetLeft+cv.offsetWidth)+'px'; handle.style.top=(cv.offsetTop+cv.offsetHeight)+'px'; }
cv.addEventListener('pointerdown',e=>{ if(!calib) return; e.preventDefault();
  const p=pt(e), st={x:SCREEN.x,y:SCREEN.y}, r=stage.getBoundingClientRect();
  const mv=ev=>{ const q=pt(ev); SCREEN.x=clamp(st.x+(q.x-p.x)/r.width*100,0,90);
    SCREEN.y=clamp(st.y+(q.y-p.y)/r.height*100,0,90); layoutScreen(); };
  const up=()=>{ document.removeEventListener('pointermove',mv); document.removeEventListener('pointerup',up); };
  document.addEventListener('pointermove',mv); document.addEventListener('pointerup',up); });
handle.addEventListener('pointerdown',e=>{ if(!calib) return; e.preventDefault(); e.stopPropagation();
  const p=pt(e), st={w:SCREEN.w,h:SCREEN.h}, r=stage.getBoundingClientRect();
  const mv=ev=>{ const q=pt(ev); SCREEN.w=clamp(st.w+(q.x-p.x)/r.width*100,4,60);
    SCREEN.h=clamp(st.h+(q.y-p.y)/r.height*100,4,60); layoutScreen(); };
  const up=()=>{ document.removeEventListener('pointermove',mv); document.removeEventListener('pointerup',up); };
  document.addEventListener('pointermove',mv); document.addEventListener('pointerup',up); });

// ---- toolbar --------------------------------------------------------------
function setCal(on){ calib=on; document.body.classList.toggle('cal',on);
  document.getElementById('bcal').classList.toggle('on',on);
  document.getElementById('bsave').style.display=on?'':'none';
  document.getElementById('breset').style.display=on?'':'none';
  positionHandle();
  log(on?'calibration ON — drag controls & screen, then Save':'calibration off'); }
document.getElementById('bcal').onclick=()=>setCal(!calib);
document.getElementById('brel').onclick=()=>{ release(); document.querySelectorAll('.hs.down').forEach(e=>e.classList.remove('down')); log('⏹ release all'); };
document.getElementById('bsave').onclick=async()=>{
  const out={screen:SCREEN, ctrls:{}};
  for(const c of CTRLS) out.ctrls[c.id]={cx:+c.cx.toFixed(2),cy:+c.cy.toFixed(2),w:+c.w.toFixed(2),h:+c.h.toFixed(2)};
  const r=await fetch('/savecal',{method:'POST',body:JSON.stringify(out)});
  log(r.ok?'✓ layout saved (assets/calibration.json)':'save failed'); };
document.getElementById('breset').onclick=async()=>{
  SCREEN=Object.assign({},SCREEN0); CTRLS=CTRLS0.map(c=>Object.assign({},c));
  build(); await fetch('/savecal',{method:'POST',body:JSON.stringify({})}); log('layout reset to defaults'); };
window.addEventListener('keydown',e=>{ if(e.key==='c'||e.key==='C'){ if(e.target.tagName!=='INPUT') setCal(!calib); }});

// ---- load calibration overrides, then build -------------------------------
async function init(){
  try{ const r=await fetch('/cal?t='+Date.now()); if(r.ok){ const j=await r.json();
    if(j.screen) SCREEN=Object.assign({},SCREEN0,j.screen);
    if(j.ctrls) for(const c of CTRLS){ const o=j.ctrls[c.id]; if(o) Object.assign(c,o); }
    if(j.screen||j.ctrls) log('loaded saved calibration'); } }catch(e){}
  build(); pump();
  window.addEventListener('resize',()=>{ layoutScreen(); });
}
init();
