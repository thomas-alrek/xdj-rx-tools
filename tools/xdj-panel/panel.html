<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>XDJ-RX panel</title>
<!-- Knobs/faders: MIT "audio-knobs" (HowdyMoto/Knobs), served from /knobs/. Pure SVG. -->
<script src="/knobs/knobs.js"></script>
<style>
  :root{ --bg:#0a0b0d; --ink:#e8ebf0; --dim:#aeb6c0; --edge:#2b2f36; --edge2:#3a414b;
    --accent:#39b3ff; --ok:#39d98a; --red:#e5484d; --purp:#4a78ff; --panel:#14171c; }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:#070809;color:var(--ink);
    font:13px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    -webkit-user-select:none;user-select:none;display:flex;flex-direction:column}
  .bar{display:flex;align-items:center;gap:10px;padding:8px 14px;background:#131519;
    border-bottom:1px solid var(--edge);z-index:50;flex-wrap:wrap;flex:0 0 auto}
  .bar h1{font-size:13px;margin:0;letter-spacing:2px;font-weight:800;color:#cdd3db}
  .bar h1 b{color:var(--accent)}
  .bar .sp{flex:1}
  .conn{font-size:11px;padding:3px 10px;border-radius:20px;border:1px solid var(--edge);color:var(--red)}
  .conn.up{color:var(--ok);border-color:#2a6b4f}
  .tgl{appearance:none;border:1px solid var(--edge2);background:#1b1f26;color:var(--ink);
    border-radius:7px;padding:6px 11px;font-size:11px;font-weight:700;cursor:pointer}
  .tgl.deck{background:#13303f;border-color:#2a6b8f;color:#bfe3ff}
  .tgl.line{background:#3a2f1e;border-color:#6b572e;color:#ffe0a8}
  .tgl.red{background:#3a1e1f;border-color:#6b2e30;color:#ffb4b6}

  /* ---- console: fixed device aspect, controls placed absolutely (photo-calibrated) ---- */
  .stagewrap{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;padding:10px}
  #stage{position:relative;aspect-ratio:2142 / 1236;height:100%;width:auto;max-width:100%;
    background:radial-gradient(130% 100% at 50% 0%,#16191e,#0a0c0f 72%);
    border:1px solid #23272e;border-radius:14px;overflow:hidden;container-type:size;box-shadow:0 10px 40px #000a}
  /* decorative zone panels behind the controls */
  .pbg{position:absolute;background:linear-gradient(180deg,#13161b,#0e1115);border:1px solid #20242b;border-radius:12px}

  .hs{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:stretch;justify-content:center}
  .hs>.cell,.hs>.btn,.hs>.jogcell{width:100%;height:100%}

  /* ---- cells ---- */
  .cell{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-width:0;min-height:0}
  .kwrap{flex:1 1 auto;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;overflow:visible;position:relative}
  .kwrap svg{width:100%;height:100%;display:block}
  .cell.knob .kwrap svg,.cell.enc .kwrap svg,.cell.rot .kwrap svg{transform:scale(1.28)}
  .cap{font-size:clamp(4px,.6cqw,8px);line-height:1;color:var(--dim);font-weight:700;letter-spacing:.1px;
    white-space:nowrap;pointer-events:none;text-shadow:0 1px 2px #000;max-width:100%;overflow:hidden;text-overflow:ellipsis;flex:0 0 auto}

  /* buttons */
  .btn{cursor:pointer;border-radius:4px;border:1px solid var(--edge2);width:100%;height:100%;min-height:10px;
    background:linear-gradient(180deg,#242a33,#171b21);color:#cfd5de;
    font-size:clamp(4px,.62cqw,9px);font-weight:700;letter-spacing:.1px;text-align:center;line-height:1.02;
    padding:0 1px;overflow:hidden;transition:.05s;box-shadow:0 1px 0 #0007 inset;
    display:flex;align-items:center;justify-content:center;white-space:normal;overflow-wrap:anywhere}
  .btn.round{border-radius:50%;aspect-ratio:1/1;height:100%;width:auto;max-width:100%;margin:auto}
  .btn:hover{border-color:#525a66;color:#fff}
  .btn.down,.btn:active{background:linear-gradient(180deg,#1b4a63,#123246);border-color:var(--accent);
    color:#eaf6ff;box-shadow:0 0 10px #39b3ff66,0 1px 0 #0007 inset}
  .btn.pad{background:linear-gradient(180deg,#2238d0,#16249c);border-color:#4a78ff;color:#dfe6ff;border-radius:5px}
  .btn.pad.down,.btn.pad:active{background:linear-gradient(180deg,#3a5bff,#2238d0);box-shadow:0 0 12px #4a78ff88}
  .btn.jogbtn{border-radius:50%;aspect-ratio:1/1;height:100%;width:auto;max-width:100%;margin:auto;
    border:1px solid #5a616c;color:#eef1f5;font-weight:800;font-size:clamp(5px,.8cqw,12px);
    background:radial-gradient(circle at 50% 32%,#545a64,#262a31 72%);box-shadow:0 3px 9px #000b,inset 0 1px 0 #ffffff22}
  .btn.jogbtn:hover{border-color:#7b8491;color:#fff}
  .btn.jogbtn.down,.btn.jogbtn:active{background:radial-gradient(circle at 50% 32%,#6c737e,#30353d);box-shadow:inset 0 2px 7px #000b}
  .btn.jogbtn.play{background:radial-gradient(circle at 50% 32%,#51805f,#1d3827 72%);border-color:#3f7a57;color:#ddffea}
  .btn.jogbtn.play.down,.btn.jogbtn.play:active{background:radial-gradient(circle at 50% 32%,#63df93,#1e7a46)}
  .btn.unmapped{opacity:.5;border-style:dashed;cursor:default}

  /* jog platter */
  .jogcell{min-width:0;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .jog{aspect-ratio:1/1;width:100%;height:auto;max-height:100%;margin:auto;border-radius:50%;position:relative;
    cursor:grab;touch-action:none;border:2px solid #090a0c;
    background:radial-gradient(circle at 50% 40%,#3b4048 0%,#24282e 38%,#161a1f 63%,#0b0d10 100%);
    box-shadow:0 7px 22px #000c,inset 0 2px 7px #ffffff12,inset 0 -9px 22px #0009}
  .jog:active{cursor:grabbing}
  .jog::before{content:"";position:absolute;inset:9%;border-radius:50%;opacity:.85;
    background:repeating-conic-gradient(#1b1f24 0deg 5deg,#13161b 5deg 10deg);box-shadow:inset 0 0 14px #000c}
  .jog::after{content:"";position:absolute;inset:34%;border-radius:50%;border:1px solid #0a0b0d;
    background:radial-gradient(circle at 50% 38%,#2d323b,#14171c 72%);box-shadow:inset 0 2px 6px #ffffff14,0 2px 7px #0009}

  /* vertical faders (tempo / channel) */
  .cell.vfader{justify-content:stretch}
  .vtrack{position:relative;flex:1 1 auto;min-height:20px;width:100%;cursor:ns-resize}
  .vtrack::before{content:"";position:absolute;left:50%;top:3%;bottom:3%;width:5px;transform:translateX(-50%);
    background:linear-gradient(90deg,#050608,#1b1f26,#050608);border-radius:3px;box-shadow:inset 0 0 4px #000c,0 0 0 1px #000}
  .vtrack.ctr::after{content:"";position:absolute;left:50%;top:50%;width:46%;height:2px;transform:translate(-50%,-50%);background:#444b55}
  .vthumb{position:absolute;left:50%;width:80%;max-width:26px;min-width:12px;height:12%;min-height:8px;max-height:15px;
    transform:translate(-50%,50%);border-radius:4px;border:1px solid #0009;pointer-events:none;
    background:linear-gradient(180deg,#d7dde4,#8b94a1);box-shadow:0 2px 6px #0009,inset 0 1px 0 #fff6}

  /* crossfader (horizontal) */
  .cell.xf{flex-direction:column;justify-content:center}
  .htrack{position:relative;width:100%;flex:1 1 auto;min-height:10px;max-height:22px;margin:auto 0;cursor:ew-resize}
  .htrack::before{content:"";position:absolute;top:50%;left:2%;right:2%;height:5px;transform:translateY(-50%);
    background:linear-gradient(180deg,#050608,#1b1f26,#050608);border-radius:3px;box-shadow:inset 0 0 4px #000c,0 0 0 1px #000}
  .hthumb{position:absolute;top:50%;height:150%;max-height:26px;width:13%;max-width:20px;min-width:11px;
    transform:translate(-50%,-50%);border-radius:4px;border:1px solid #0009;pointer-events:none;
    background:linear-gradient(90deg,#d7dde4,#8b94a1);box-shadow:0 2px 6px #0009,inset 0 1px 0 #fff6}

  /* browse encoder centre push */
  .encpush{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:46%;height:auto;aspect-ratio:1/1;border-radius:50%;
    background:radial-gradient(circle at 50% 34%,#2c333d,#13171e);border:1px solid #3a414b;color:#aeb6c0;
    font-size:clamp(4px,.56cqw,8px);font-weight:800;letter-spacing:.3px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px #000a,inset 0 1px 0 #ffffff12}
  .encpush:hover{color:#fff;border-color:#55606e}
  .encpush.down{background:radial-gradient(circle at 50% 34%,#1b4a63,#0e2636);border-color:var(--accent);
    color:#eaf6ff;box-shadow:0 0 12px #39b3ff88}

  /* screen */
  #screen{position:absolute;background:#000;border-radius:6px;overflow:hidden;
    box-shadow:0 0 0 1px #000,0 4px 18px #0009;display:flex;align-items:center;justify-content:center}
  #screen canvas{width:100%!important;height:100%!important;display:block}
  /* noVNC hides the local cursor and draws the remote one; the firmware has no cursor,
     so force our normal pointer over the display area instead of an invisible one. */
  #screen,#screen *{cursor:default!important}

  .logwrap{flex:0 0 auto;padding:8px 14px}
  #logbox{height:46px;overflow:auto;background:#0b0d10;border:1px solid var(--edge);border-radius:8px;
    padding:6px 9px;font:11px/1.45 ui-monospace,Menlo,monospace;color:#9aa7b4;white-space:pre-wrap;
    -webkit-user-select:text;user-select:text;cursor:text}
</style>
</head>

<div class="stagewrap"><div id="stage"></div></div>
<div class="logwrap"><div id="logbox"></div></div>

  // deck 2 (mirror positions from the photo)
  d2in:[66.07,32.03,2.8,2.8], d2out:[69.49,31.87,2.8,2.8], d2reloop:[73.3,32.0,2.8,2.8],

  d2trng:[93.44,52.9,2.8,2.8], d2_mastertempo:[93.22,58.33,2.8,2.8],
  d2_tsL:[65.25,49.7,2.0,2.4], d2_tsR:[67.75,49.7,2.0,2.4], d2_srchL:[65.25,56.5,2.0,2.4], d2_srchR:[67.75,56.5,2.0,2.4],
  d2jog:[79.9,58.0,20.0,34.0],
  d2cue:[66.99,74.81,5.2,6.6], d2play:[66.92,85.3,5.2,6.6],
  d2_hotcuemode:[73.39,79.84,3.4,2.8], d2auto:[77.6,79.85,3.4,2.8], d2_loopslice:[81.87,79.78,3.6,2.8], d2shift:[86.22,79.73,3.4,2.8],
  d2h1:[73.37,86.4,3.4,5.0], d2h2:[77.66,86.5,3.4,5.0], d2h3:[81.85,86.4,3.4,5.0], d2h4:[86.06,86.5,3.4,5.0],
  d2tempo:[93.38,76.0,3.2,26.0],
};
// decorative zone rectangles [x,y,w,h]
const ZONES=[[1.0,16.5,25.2,10.0],[31.3,2.5,33.0,24.0],[74.5,15.0,21.3,11.5],
  [0.8,28.0,32.8,63.0],[33.7,28.0,29.9,63.0],[63.7,28.0,32.8,63.0]];
const XOFF=1.1; // shift whole console right so left/right margins match

// ===== server I/O =========================================================
const logbox=document.getElementById('logbox');
function log(m){ const t=new Date().toLocaleTimeString();
  logbox.textContent=`[${t}] ${m}\n`+logbox.textContent;
  if(logbox.textContent.length>4000) logbox.textContent=logbox.textContent.slice(0,4000); }
async function post(p,b){ try{ await fetch(p,{method:'POST',body:b||''}); }catch(e){ log('POST '+p+' failed'); } }
function sctrl(spec){ post('/ctrl',spec); }
function release(){ post('/release'); }
function mainkey(n){ post('/mainkey',String(n)); }
function mainkeyRelease(){ post('/mainkey_release'); }
const _src={0:'DECK',1:'DECK'};
function _srcUI(ch){ const b=document.getElementById('src'+ch); if(!b) return; const s=_src[ch];
  b.textContent='CH'+(ch+1)+': '+s; b.classList.toggle('deck',s==='DECK'); b.classList.toggle('line',s==='LINE'); }
function setSrc(ch,s){ _src[ch]=s; _srcUI(ch); post('/input', ch+' '+s); log('CH'+(ch+1)+' input: '+s); }
function toggleSrc(ch){ setSrc(ch, _src[ch]==='DECK'?'LINE':'DECK'); }
const isAnalog=s=>!!s && /^a /i.test(s);
// USB mount: in the app, open a native file dialog via the Tauri `pick_usb_image`
// command; in a plain dev browser, fall back to a typed path. Either way the chosen
// path is POSTed to /usb, which does the drive_add/device_add insert.
const _lastUsb={usb1:'',usb2:''};
async function doMount(slot, path){
  const S=slot.toUpperCase(); _lastUsb[slot]=path; log('⏏ '+S+': mounting '+path+' …');
  try{ const r=await fetch('/usb',{method:'POST',body:slot+' '+path}); const t=(await r.text()).trim();
    log((r.ok?'✔ ':'✖ ')+t); }catch(e){ log('✖ '+S+' mount request failed'); }
}
async function mountUsb(slot){
  const S=slot.toUpperCase();
  const D=window.__TAURI__ && window.__TAURI__.dialog;
  if(D && D.open){
    log('⏏ '+S+': choosing an image…');
    try{ const p=await D.open({ multiple:false, directory:false,
        title:'Select a USB disk image for '+S,
        filters:[{name:'Disk images',extensions:['img','dmg','iso','bin','raw']},
                 {name:'All files',extensions:['*']}] });
      if(!p){ log('… '+S+' cancelled'); return; }
      return doMount(slot, Array.isArray(p)?p[0]:p);
    }catch(e){ log('✖ file dialog failed: '+e); return; }
  }
  // dev browser (no Tauri): type a path
  const p=prompt('Mount USB on '+S+'\nPath to a disk image (.img / .dmg) or a device (/dev/...):',
    _lastUsb[slot]||'');
  if(p==null) return; const path=p.trim(); if(path) doMount(slot, path);
}

// ===== widgets ============================================================
const Kn=window.Knobs;
const KS={showValueDisplay:false,showValueLabels:false,showTicks:false,label:'',fontFamily:'inherit',
  dialColor:'#20242b',bezelColor:'#30353d',indicatorColor:'#39b3ff',tickColor:'#4a515b'};
const d=(cls)=>{ const e=document.createElement('div'); if(cls)e.className=cls; return e; };
const kwrap=(n)=>{ const w=d('kwrap'); w.appendChild(n); return w; };
const cap=(t)=>{ const e=d('cap'); e.textContent=t; return e; };

function btnCell(id){ const c=C[id];
  const el=d('btn'+(c.round?' round':'')+(c.big?' jogbtn':'')+(c.pad?' pad':'')+(c.play?' play':''));
  const mapped=!!(c.spec||c.gpio||c.usb); if(!mapped) el.classList.add('unmapped');
  el.textContent=c.l; el.title=c.l+(c.spec?('  ['+c.spec+']'):(c.gpio?('  [gpio '+c.gpio+']'):(c.usb?'  (mount a USB image/device)':'  (unmapped)')));
  let lp=null;
  el.addEventListener('pointerdown',e=>{ e.preventDefault();
    if(c.usb){ el.classList.add('down'); setTimeout(()=>el.classList.remove('down'),160); mountUsb(c.usb); return; }
    if(c.gpio){ el.classList.add('down'); mainkey(c.gpio); return; }
    if(!c.spec){ log('· '+c.l+' — unmapped'); return; }
    el.classList.add('down'); sctrl(c.spec);
    if(c.longpress) lp=setTimeout(()=>sctrl('B '+c.spec.replace(/^[bB] /,'')),1100);
    log('▸ '+c.l+'  '+c.spec); });
  const up=()=>{ if(c.gpio){ el.classList.remove('down'); mainkeyRelease(); return; }
    if(c.spec){ if(lp){clearTimeout(lp);lp=null;} el.classList.remove('down'); release(); } };
  el.addEventListener('pointerup',up);
  el.addEventListener('pointerleave',()=>{ if(el.classList.contains('down')) up(); });
  return el;
}
function knobCell(id){ const c=C[id]; const el=d('cell knob'); const m=d();
  try{ const k=new Kn.Knob(m,Object.assign({},KS,{mode:'bounded',min:0,max:1023,value:c.v==null?512:c.v,size:100}));
    if(isAnalog(c.spec)) k.onChange(e=>sctrl(c.spec+' '+Math.round(e.value).toString(16)));
  }catch(e){ m.textContent='⊘'; }
  el.append(kwrap(m)); if(c.l) el.appendChild(cap(c.l)); el.title=c.l; return el;
}
function faderCell(id){ const c=C[id]; const center=c.t==='vfader-c'; const el=d('cell vfader');
  const track=d('vtrack'+(center?' ctr':'')); const thumb=d('vthumb'); track.appendChild(thumb);
  let val=c.v==null?(center?512:0):c.v;
  const show=()=>{ thumb.style.bottom=(val/1023*100)+'%'; };
  const emit=()=>{ if(center && c.specNeg && c.specPos){ const lo=Math.round(val),hi=1023-lo;
      sctrl(c.specNeg+' '+lo.toString(16)+'\n'+c.specPos+' '+hi.toString(16)); }
    else if(isAnalog(c.spec)) sctrl(c.spec+' '+Math.round(val).toString(16)); };
  const fromY=e=>{ const r=track.getBoundingClientRect(); let f=1-(e.clientY-r.top)/r.height;
    val=Math.max(0,Math.min(1,f))*1023; show(); emit(); };
  let drag=false;
  track.addEventListener('pointerdown',e=>{ e.preventDefault(); drag=true; try{track.setPointerCapture(e.pointerId);}catch(_){} fromY(e); });
  track.addEventListener('pointermove',e=>{ if(drag) fromY(e); });
  const end=()=>{ drag=false; }; track.addEventListener('pointerup',end); track.addEventListener('pointercancel',end);
  show(); el.append(track); if(c.l) el.appendChild(cap(c.l)); el.title=c.l; return el;
}
function xfaderCell(id){ const c=C[id]; const el=d('cell xf'); const track=d('htrack'); const thumb=d('hthumb'); track.appendChild(thumb);
  let val=c.v==null?512:c.v;
  const show=()=>{ thumb.style.left=(val/1023*100)+'%'; };
  const fromX=e=>{ const r=track.getBoundingClientRect(); let f=(e.clientX-r.left)/r.width;
    val=Math.max(0,Math.min(1,f))*1023; show(); if(isAnalog(c.spec)) sctrl(c.spec+' '+Math.round(val).toString(16)); };
  let drag=false;
  track.addEventListener('pointerdown',e=>{ e.preventDefault(); drag=true; try{track.setPointerCapture(e.pointerId);}catch(_){} fromX(e); });
  track.addEventListener('pointermove',e=>{ if(drag) fromX(e); });
  const end=()=>{ drag=false; }; track.addEventListener('pointerup',end); track.addEventListener('pointercancel',end);
  show(); el.append(track); el.title=c.l; return el;
}
function rotaryCell(id){ const c=C[id]; const el=d('cell rot'); const m=d(); let last=null,acc=0,t=0; const STEP=.5;
  const det=s=>{ const sp=s>0?c.specUp:c.specDown; if(sp) sctrl(sp); };
  try{ const k=Kn.createInfiniteKnob(m,Object.assign({},KS,{size:120,gripBumps:false}));
    k.onChange(e=>{ if(last==null){last=e.value;return;} let dd=e.value-last; last=e.value; acc+=dd; const now=performance.now();
      while(acc>=STEP){acc-=STEP; if(now-t>16){det(1);t=now;}} while(acc<=-STEP){acc+=STEP; if(now-t>16){det(-1);t=now;}} });
  }catch(e){ m.textContent='⊘'; }
  el.append(kwrap(m)); if(c.l) el.appendChild(cap(c.l)); el.title=c.l; return el;
}
function encoderCell(id){ const c=C[id]; const el=d('cell enc'); const m=d(); let last=null,acc=0,t=0; const STEP=.35;
  try{ const k=Kn.createInfiniteKnob(m,Object.assign({},KS,{size:120,gripBumps:true,gripBumpCount:30,
      dialColor:'#1b1f26',bezelColor:'#343b45'}));
    k.onChange(e=>{ if(last==null){last=e.value;return;} let dd=e.value-last; last=e.value; acc+=dd; const now=performance.now();
      while(acc>=STEP){acc-=STEP; if(now-t>16){post('/browse','1');t=now;}}
      while(acc<=-STEP){acc+=STEP; if(now-t>16){post('/browse','-1');t=now;}} });
  }catch(e){ m.textContent='⊘'; }
  const kw=kwrap(m);
  const push=d('encpush'); push.textContent='PUSH';
  push.addEventListener('pointerdown',ev=>{ ev.preventDefault(); ev.stopPropagation(); push.classList.add('down');
    sctrl(c.pushSpec); log('▸ BROWSE push'); });
  const pup=()=>{ if(push.classList.contains('down')){ push.classList.remove('down'); release(); } };
  push.addEventListener('pointerup',pup); push.addEventListener('pointerleave',pup);
  kw.appendChild(push); el.appendChild(kw);
  let wa=0,wt=null; el.addEventListener('wheel',ev=>{ ev.preventDefault(); let dy=ev.deltaY;
    if(ev.deltaMode===1)dy*=16; else if(ev.deltaMode===2)dy*=400; wa+=dy;
    if(!wt) wt=setTimeout(()=>{ wt=null; let s=Math.max(-3,Math.min(3,Math.trunc(wa/80)));
      if(s){ wa-=s*80; post('/browse',String(s)); } else if(Math.abs(wa)>320) wa=0; },70); },{passive:false});
  el.title='BROWSE — rotate to scroll, push to select'; return el;
}
function jogCell(id){ const c=C[id]; const el=d('cell jogcell'); const j=d('jog');
  let dragging=false,lastA=null,acc=0,t=0; const STEP=12;
  const ang=e=>{ const r=j.getBoundingClientRect(); return Math.atan2(e.clientY-(r.top+r.height/2),e.clientX-(r.left+r.width/2))*180/Math.PI; };
  const det=s=>{ const sp=s>0?c.specUp:c.specDown; if(sp) sctrl(sp); };
  j.addEventListener('pointerdown',e=>{ e.preventDefault(); dragging=true; lastA=ang(e); try{ j.setPointerCapture(e.pointerId); }catch(_){} });
  j.addEventListener('pointermove',e=>{ if(!dragging) return; const a=ang(e); let dd=a-lastA;
    if(dd>180)dd-=360; if(dd<-180)dd+=360; lastA=a; acc+=dd; const now=performance.now();
    while(acc>=STEP){acc-=STEP; if(now-t>14){det(1);t=now;}} while(acc<=-STEP){acc+=STEP; if(now-t>14){det(-1);t=now;}} });
  const end=()=>{ dragging=false; lastA=null; };
  j.addEventListener('pointerup',end); j.addEventListener('pointercancel',end);
  let wa=0,wt=null; el.addEventListener('wheel',ev=>{ ev.preventDefault(); let dy=ev.deltaY;
    if(ev.deltaMode===1)dy*=16; else if(ev.deltaMode===2)dy*=400; wa+=dy;
    if(!wt) wt=setTimeout(()=>{ wt=null; let s=Math.max(-4,Math.min(4,Math.trunc(wa/60)));
      if(s){ wa-=s*60; for(let i=0;i<Math.abs(s);i++) det(s>0?1:-1); } else if(Math.abs(wa)>240) wa=0; },60); },{passive:false});
  el.append(j); el.title=(c.l||'JOG')+' — drag to scratch / pitch-bend'; return el;
}
function cell(id){ const c=C[id]; if(!c) return d();
  switch(c.t){ case 'knob':return knobCell(id); case 'vfader':case 'vfader-c':return faderCell(id);
    case 'xfader':return xfaderCell(id); case 'rotary':return rotaryCell(id);
    case 'encoder':return encoderCell(id); case 'jog':return jogCell(id);
    default:return btnCell(id); } }

// ===== build (absolute placement) =========================================
function build(){
  const stage=document.getElementById('stage');
  for(const z of ZONES){ const p=d('pbg');
    p.style.left=(z[0]+XOFF)+'%'; p.style.top=z[1]+'%'; p.style.width=z[2]+'%'; p.style.height=z[3]+'%'; stage.appendChild(p); }
  for(const id in COORDS){ const b=COORDS[id]; if(!C[id]) continue;
    const box=d('hs'); box.style.left=(b[0]+XOFF)+'%'; box.style.top=b[1]+'%'; box.style.width=b[2]+'%'; box.style.height=b[3]+'%';
    box.appendChild(cell(id)); stage.appendChild(box); }
  const sc=d(''); sc.id='screen';
  sc.style.left=(SCREEN0.x+XOFF)+'%'; sc.style.top=SCREEN0.y+'%'; sc.style.width=SCREEN0.w+'%'; sc.style.height=SCREEN0.h+'%';
  stage.appendChild(sc);
}

// ===== live screen ========================================================
const VNC=new URLSearchParams(location.search).get('vnc');
const conn=document.getElementById('conn');
let rfb=null;
async function startScreen(){
  const host=document.getElementById('screen'); if(!host) return;
  if(VNC){ let RFB; try{ ({default:RFB}=await import('/novnc/core/rfb.js')); }
    catch(e){ conn.textContent='screen: noVNC load failed'; return; }
    const connect=()=>{ conn.className='conn'; conn.textContent='screen: connecting…';
      rfb=new RFB(host,VNC); rfb.viewOnly=true; rfb.scaleViewport=true; rfb.clipViewport=false; rfb.background='#000';
      rfb.addEventListener('connect',()=>{ conn.className='conn up'; conn.textContent='screen: live'; });
      rfb.addEventListener('disconnect',()=>{ conn.className='conn'; conn.textContent='screen: no QEMU'; setTimeout(connect,1000); }); };
    connect();
  } else {
    const cv=document.createElement('canvas'); cv.width=800; cv.height=480; host.appendChild(cv); const cx=cv.getContext('2d'); let img=null;
    const pump=async()=>{ try{ const r=await fetch('/raw?t='+Date.now(),{cache:'no-store'}); if(!r.ok) throw 0;
      const w=+r.headers.get('X-Width')||800,h=+r.headers.get('X-Height')||480; const buf=new Uint8Array(await r.arrayBuffer());
      if(cv.width!==w||cv.height!==h){ cv.width=w; cv.height=h; img=null; }
      if(!img) img=cx.createImageData(w,h); const o=img.data,n=w*h;
      for(let i=0,j=0;i<n;i++){ o[j++]=buf[i*3]; o[j++]=buf[i*3+1]; o[j++]=buf[i*3+2]; o[j++]=255; }
      cx.putImageData(img,0,0); conn.className='conn up'; conn.textContent='screen: live'; requestAnimationFrame(pump);
    }catch(e){ conn.className='conn'; conn.textContent='screen: no QEMU'; setTimeout(pump,700); } };
    pump();
  }
}

// ===== dev calibration overlay (never shipped; ?cal=1 and XDJ_CAL_REF set) =
function calOverlay(){
  const q=new URLSearchParams(location.search); if(!q.has('cal')) return;
  const op=parseFloat(q.get('cal'))||0.45;
  const img=document.createElement('img'); img.src='/cal-ref';
  Object.assign(img.style,{position:'absolute',inset:'0',width:'100%',height:'100%',
    objectFit:'fill',opacity:String(op),pointerEvents:'none',zIndex:'99'});
  const stage=document.getElementById('stage'); stage.appendChild(img);
  addEventListener('keydown',e=>{ if(e.key==='='||e.key==='+') img.style.opacity=Math.min(1,parseFloat(img.style.opacity)+0.1);
    else if(e.key==='-') img.style.opacity=Math.max(0,parseFloat(img.style.opacity)-0.1);
    else if(e.key==='o') img.style.display=img.style.display==='none'?'block':'none'; });
}

// ===== init ===============================================================
function init(){
  if(!Kn) log('Knobs library failed to load (/knobs/knobs.js)');
  build(); startScreen(); calOverlay();
  document.getElementById('src0').addEventListener('click',()=>toggleSrc(0));
  document.getElementById('src1').addEventListener('click',()=>toggleSrc(1));
  document.getElementById('brel').addEventListener('click',()=>{ release(); mainkeyRelease();
    document.querySelectorAll('.btn.down,.encpush.down').forEach(e=>e.classList.remove('down')); log('⏹ release all'); });
  setSrc(0,'DECK'); setSrc(1,'DECK');
}
init();
