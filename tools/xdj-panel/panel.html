<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>XDJ-RX panel</title>
<!-- Knobs/faders: the MIT-licensed "audio-knobs" library (HowdyMoto/Knobs), served
     from /knobs/ (npm: app/ui/node_modules/audio-knobs/dist). Pure SVG, no deps. -->
<script src="/knobs/knobs.js"></script>
<style>
  :root{
    --bg:#0a0b0d; --panel:#131519; --panel2:#171a1f; --edge:#262a31; --edge2:#333945;
    --ink:#e8ebf0; --dim:#8b94a1; --accent:#39b3ff; --accent2:#4ecdc4;
    --ok:#39d98a; --red:#e5484d; --amber:#e0a63a;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:
      radial-gradient(1200px 600px at 50% -10%, #15181d 0%, var(--bg) 60%);
    color:var(--ink);font:13px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    -webkit-user-select:none;user-select:none}
  /* top bar */
  .bar{display:flex;align-items:center;gap:10px;padding:9px 16px;background:var(--panel);
    border-bottom:1px solid var(--edge);position:sticky;top:0;z-index:50;flex-wrap:wrap}
  .bar h1{font-size:13px;margin:0;letter-spacing:2px;font-weight:800;color:#cdd3db}
  .bar h1 b{color:var(--accent)}
  .bar .sp{flex:1}
  .conn{font-size:11px;padding:3px 10px;border-radius:20px;border:1px solid var(--edge);color:var(--red)}
  .conn.up{color:var(--ok);border-color:#2a6b4f}
  .tgl{appearance:none;border:1px solid var(--edge2);background:#1b1f26;color:var(--ink);
    border-radius:7px;padding:6px 11px;font-size:11px;font-weight:700;cursor:pointer;letter-spacing:.3px}
  .tgl.deck{background:#13303f;border-color:#2a6b8f;color:#bfe3ff}
  .tgl.line{background:#3a2f1e;border-color:#6b572e;color:#ffe0a8}
  .tgl.red{background:#3a1e1f;border-color:#6b2e30;color:#ffb4b6}
  /* console layout */
  .console{display:grid;grid-template-columns:minmax(240px,1fr) minmax(460px,1.6fr) minmax(240px,1fr);
    gap:14px;max-width:1500px;margin:0 auto;padding:16px}
  @media(max-width:1100px){ .console{grid-template-columns:1fr} }
  .col{display:flex;flex-direction:column;gap:12px;min-width:0}
  .deck{background:linear-gradient(180deg,var(--panel2),#101216);border:1px solid var(--edge);
    border-radius:14px;padding:14px}
  .deckhdr{display:flex;align-items:center;justify-content:space-between;margin:-2px 0 10px}
  .deckhdr .dn{font-size:12px;font-weight:800;letter-spacing:2px;color:var(--accent)}
  .deckhdr .dn.r{color:var(--accent2)}
  .card{background:var(--panel2);border:1px solid var(--edge);border-radius:12px;padding:12px}
  .grp{margin-bottom:10px}
  .grp:last-child{margin-bottom:0}
  .gt{font-size:9px;letter-spacing:1.6px;color:var(--dim);font-weight:700;margin:0 0 7px 2px;text-transform:uppercase}
  .row{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end}
  .row.center{justify-content:center}
  /* widgets */
  .w{display:flex;flex-direction:column;align-items:center;gap:4px}
  .wlab{font-size:8.5px;letter-spacing:.4px;color:var(--dim);font-weight:700;text-align:center;
    max-width:72px;line-height:1.1}
  /* buttons */
  .pad{appearance:none;cursor:pointer;color:#cdd3db;background:linear-gradient(180deg,#232832,#191d24);
    border:1px solid var(--edge2);border-radius:8px;padding:0 9px;min-width:40px;height:30px;
    font-size:9.5px;font-weight:700;letter-spacing:.3px;display:inline-flex;align-items:center;
    justify-content:center;text-align:center;line-height:1.05;transition:.06s;box-shadow:0 1px 0 #0006 inset}
  .pad:hover{border-color:#49515e;color:#fff}
  .pad:active,.pad.down{background:linear-gradient(180deg,#1b4a63,#123246);border-color:var(--accent);
    color:#eaf6ff;box-shadow:0 0 10px #39b3ff55, 0 1px 0 #0006 inset}
  .pad.round{border-radius:50%;width:46px;height:46px;min-width:0;padding:0}
  .pad.big{height:48px;min-width:64px;font-size:11px}
  .pad.play.down,.pad.play:active{background:linear-gradient(180deg,#1b633a,#123a24);border-color:var(--ok);box-shadow:0 0 10px #39d98a55}
  .pad.hot{background:linear-gradient(180deg,#2a2433,#1c1824);border-color:#4a3a63}
  .pad.hot:active,.pad.hot.down{background:linear-gradient(180deg,#5a2b7a,#3a1c52);border-color:#b06bff;box-shadow:0 0 10px #b06bff55}
  .pad.unmapped{opacity:.5;border-style:dashed}
  .pad.wide{min-width:60px}
  /* screen */
  .screenwrap{background:#000;border:1px solid var(--edge2);border-radius:10px;overflow:hidden;
    aspect-ratio:800/480;width:100%;box-shadow:0 0 0 1px #000, 0 8px 30px #0008}
  #screen{width:100%;height:100%}
  #screen canvas{width:100%!important;height:100%!important;display:block}
  /* crossfader */
  .xfaderw{width:100%;align-items:stretch}
  input[type=range].xf{-webkit-appearance:none;appearance:none;width:100%;height:10px;border-radius:6px;
    background:#20242b;border:1px solid var(--edge2);outline:none}
  input[type=range].xf::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:26px;border-radius:5px;
    background:linear-gradient(180deg,#cfd6df,#8b94a1);border:1px solid #0008;cursor:ew-resize}
  /* log */
  .logwrap{max-width:1500px;margin:0 auto;padding:0 16px 20px}
  #logbox{height:72px;overflow:auto;background:#0b0d10;border:1px solid var(--edge);border-radius:8px;
    padding:6px 9px;font:11px/1.45 ui-monospace,Menlo,monospace;color:#9aa7b4;white-space:pre-wrap}
  .legend{display:flex;gap:18px;color:var(--dim);font-size:10.5px;margin:7px 2px}
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:5px;vertical-align:middle}
  .dot.ok{background:var(--ok)} .dot.guess{background:var(--amber)} .dot.un{background:var(--red)}
</style>
</head>
<body>
<div class="bar">
  <h1>PIONEER <b>XDJ-RX</b> · VIRTUAL PANEL</h1>
  <span id="conn" class="conn">screen: …</span>
  <span class="sp"></span>
  <button class="tgl deck" id="src0" title="CH1 input source (DECK / LINE·PHONO)">CH1: DECK</button>
  <button class="tgl deck" id="src1" title="CH2 input source (DECK / LINE·PHONO)">CH2: DECK</button>
  <button class="tgl red" id="brel">Release all</button>
</div>

<div class="console">
  <div class="col"><div class="deck"><div class="deckhdr"><span class="dn">DECK 1</span></div><div id="deck1"></div></div></div>
  <div class="col" id="center"></div>
  <div class="col"><div class="deck"><div class="deckhdr"><span class="dn r">DECK 2</span></div><div id="deck2"></div></div></div>
</div>

<div class="logwrap">
  <div class="legend">
    <span><span class="dot ok"></span>verified</span>
    <span><span class="dot guess"></span>best-guess</span>
    <span><span class="dot un"></span>unmapped</span>
  </div>
  <div id="logbox"></div>
</div>

<script>

  {id:'d2_memory', label:'MEMORY', type:'btn', spec:'b 23 20'},
  {id:'d2_srchL', label:'SEARCH ◄', type:'btn', spec:'b 23 08'},
  {id:'d2_srchR', label:'SEARCH ►', type:'btn', spec:null},

  {id:'d2_tsR', label:'TRACK ►', type:'btn', spec:null},
  {id:'trim1', label:'TRIM', type:'knob', spec:'A 26', val:512},
  {id:'trim2', label:'TRIM', type:'knob', spec:'A 36', val:512},
  {id:'color1', label:'COLOR', type:'knob', spec:'A 2c', val:512},
  {id:'color2', label:'COLOR', type:'knob', spec:'A 3c', val:512},
  {id:'hp_mix', label:'HP MIX', type:'knob', spec:'A 4a', val:512},
  {id:'hp_lvl', label:'HP LEVEL', type:'knob', spec:'A 4c', val:512},

  {id:'masterlvl', label:'MASTER', type:'knob', spec:'A 50', val:512},

  {id:'deck2src', label:'CH2 PH/LINE', type:'btn', gpio:120},

  {id:'mic2', label:'MIC 2', type:'knob', spec:'A 46', val:512},

  {id:'xfcurve', label:'XF CURVE', type:'btn', spec:null},
];
const CMAP = Object.fromEntries(CTRLS.map(c=>[c.id,c]));

// ================= layout (original; grouped, no device photo) ==============
const LAYOUT = [
  // --- DECK 1 ---
  {col:'deck1', t:'Transport', ids:['d1play','d1cue','d1sync','d1_syncmaster','d1shift','d1_mastertempo']},
  {col:'deck1', t:'Performance', ids:['d1_hotcuemode','d1h1','d1h2','d1h3','d1h4','d1_loopslice']},
  {col:'deck1', t:'Loop', ids:['d1in','d1out','d1reloop','d1auto','d1slip','d1_jogmode','d1_rev']},
  {col:'deck1', t:'Jog', ids:['d1jog'], wide:true},
  {col:'deck1', t:'Browse / cue', ids:['d1_srchL','d1_srchR','d1_tsL','d1_tsR','d1_call_l','d1_call_r','d1_memory','d1_delete','d1_vinyladj']},
  {col:'deck1', t:'Tempo', ids:['d1trng','d1tempo']},

  // --- CENTER ---
  {col:'center', t:'Top panel', ids:['src_rb','src_midi','src_usb1','src_usb2','deck12','timemd','quant']},
  {col:'center', screen:true},
  {col:'center', t:'Browse', ids:['browse','taglist','info','menu','back','tagtrk'], encoder:true, after:['loadL','enc','loadR']},
  {col:'center', t:'EQ', ids:['trim1','eq_hi1','eq_mid1','eq_low1','color1','trim2','eq_hi2','eq_mid2','eq_low2','color2']},
  {col:'center', t:'Channel faders', ids:['cue1','ch1','ch2','cue2']},
  {col:'center', t:'Crossfader', ids:['xf','xfcurve']},

  {col:'center', t:'Beat FX', ids:['beatL','beatR','fxch','fxsel','fxtap','fxlev','fxtime','fxon']},
  {col:'center', t:'Sound Color FX', ids:['scfx_noise','scfx_gate','scfx_crush','scfx_filter']},
  {col:'center', t:'Mic', ids:['mic1','mic2','miceqhi','miceqlow','micsw']},

  {col:'deck2', t:'Tempo', ids:['d2trng','d2tempo']},

// ================= server I/O (unchanged protocol) =========================
const logbox=document.getElementById('logbox');
function log(m){ const t=new Date().toLocaleTimeString();
  logbox.textContent=`[${t}] ${m}\n`+logbox.textContent;
  if(logbox.textContent.length>4000) logbox.textContent=logbox.textContent.slice(0,4000); }
async function post(p,b){ try{ await fetch(p,{method:'POST',body:b||''}); }catch(e){ log('POST '+p+' failed'); } }
function ctrl(spec){ post('/ctrl',spec); }
function release(){ post('/release'); }
function mainkey(n){ post('/mainkey',String(n)); }
function mainkeyRelease(){ post('/mainkey_release'); }
const _src={0:'DECK',1:'DECK'};
function _srcUI(ch){ const b=document.getElementById('src'+ch); if(!b) return; const s=_src[ch];
  b.textContent='CH'+(ch+1)+': '+s; b.classList.toggle('deck',s==='DECK'); b.classList.toggle('line',s==='LINE'); }
function setSrc(ch,s){ _src[ch]=s; _srcUI(ch); post('/input', ch+' '+s); log('CH'+(ch+1)+' input: '+s); }
function toggleSrc(ch){ setSrc(ch, _src[ch]==='DECK'?'LINE':'DECK'); }
const isAnalog=s=>!!s && /^a /i.test(s);

// ================= widgets =================================================
const Kn = window.Knobs;
const KNOB_STYLE={showValueDisplay:false,showTicks:true,tickCount:11,fontFamily:'inherit',
  dialColor:'#20242b',bezelColor:'#30353d',indicatorColor:'#39b3ff',tickColor:'#4a515b',size:48};

function labelWrap(c,node,cls){ const w=document.createElement('div'); w.className='w '+(cls||'');
  w.appendChild(node); const l=document.createElement('div'); l.className='wlab'; l.textContent=c.label;
  w.appendChild(l); return w; }

function buildKnob(c){ const mount=document.createElement('div');
  try{
    const k=new Kn.Knob(mount,Object.assign({},KNOB_STYLE,{mode:'bounded',min:0,max:1023,value:(c.val==null?512:c.val)}));
    if(isAnalog(c.spec)) k.onChange(e=>ctrl(c.spec+' '+Math.round(e.value).toString(16)));
  }catch(e){ mount.textContent='⊘'; }
  return labelWrap(c,mount,'knobw');
}
function buildFader(c){ const mount=document.createElement('div'); const center=c.type==='vfader-c';
  try{
    const s=new Kn.Slider(mount,{min:0,max:1023,value:(c.val==null?(center?512:0):c.val),
      length:132,width:30,showTicks:center,tickCount:center?9:0,showValueDisplay:false,
      trackColor:'#20242b',thumbColor:'#c7ced8',tickColor:'#4a515b',labelColor:'#8b94a1',fontFamily:'inherit'});
    if(center && c.specNeg && c.specPos){
      s.onChange(e=>{ const lo=Math.round(e.value), hi=1023-lo;   // top = −, bottom = +
        ctrl(c.specNeg+' '+lo.toString(16)+'\n'+c.specPos+' '+hi.toString(16)); });
    } else if(isAnalog(c.spec)){
      s.onChange(e=>ctrl(c.spec+' '+Math.round(e.value).toString(16)));
    }
  }catch(e){ mount.textContent='⊘'; }
  return labelWrap(c,mount,'faderw2');
}
function buildXfader(c){ const w=document.createElement('div'); w.className='w xfaderw';
  const r=document.createElement('input'); r.type='range'; r.min=0; r.max=1023; r.step=1;
  r.value=(c.val==null?512:c.val); r.className='xf';
  if(isAnalog(c.spec)) r.addEventListener('input',()=>ctrl(c.spec+' '+(+r.value).toString(16)));
  const l=document.createElement('div'); l.className='wlab'; l.textContent=c.label;
  w.appendChild(r); w.appendChild(l); return w;
}
// Endless encoder (jog / fx-select / browse): degrees -> detents (20/rev).
function buildEncoder(c, onDetent, size){
  const mount=document.createElement('div');
  let lastAng=null, acc=0, lastT=0;
  try{
    const k=Kn.createInfiniteKnob(mount,Object.assign({},KNOB_STYLE,{size:size||56,gripBumps:true,gripBumpCount:20,showTicks:false}));
    k.onChange(e=>{ if(lastAng==null){lastAng=e.angle;return;} let d=e.angle-lastAng;
      if(d>180)d-=360; if(d<-180)d+=360; lastAng=e.angle; acc+=d;
      const now=performance.now();
      while(acc>=18){ acc-=18; if(now-lastT>30){ onDetent(1); lastT=now; } }
      while(acc<=-18){ acc+=18; if(now-lastT>30){ onDetent(-1); lastT=now; } } });
  }catch(e){ mount.textContent='⊘'; }
  return labelWrap(c,mount,'encw');
}

function buildButton(c){
  const b=document.createElement('button');
  b.className='pad'+(c.big?' big':'')+(c.kind==='hot'?' hot':'')+(c.kind==='play'?' play':'')
    +(c.id.startsWith('d')&&(c.id.endsWith('play')||c.id.endsWith('cue'))?' round':'')
    +(!(c.spec||c.gpio||c.browse)?' unmapped':'');
  b.textContent=c.label;
  const mapped=!!(c.spec||c.gpio||c.browse);
  b.title=c.label+(mapped?'':'  (unmapped)');
  let lp=null;
  b.addEventListener('pointerdown',e=>{ e.preventDefault();
    if(c.browse){ b.classList.add('down'); post('/browse',String(c.browse));
      setTimeout(()=>b.classList.remove('down'),110); log('↻ '+c.label+' browse '+(c.browse>0?'+':'')+c.browse); return; }
    if(c.gpio){ b.classList.add('down'); mainkey(c.gpio); log('▸ '+c.label+' gpio '+c.gpio); return; }
    if(!c.spec){ log('· '+c.label+' — unmapped'); return; }
    b.classList.add('down'); ctrl(c.spec);
    if(c.longpress){ lp=setTimeout(()=>ctrl('B '+c.spec.replace(/^[bB] /,'')),1100); }
    log('▸ '+c.label+'  '+c.spec);
  });
  const up=()=>{ if(c.gpio){ b.classList.remove('down'); mainkeyRelease(); return; }
    if(c.spec){ if(lp){clearTimeout(lp);lp=null;} b.classList.remove('down'); release(); } };
  b.addEventListener('pointerup',up);
  b.addEventListener('pointerleave',()=>{ if(b.classList.contains('down')) up(); });
  if(c.browseWheel){ let wa=0,wt=null; const STEP=80,CAP=3;
    b.addEventListener('wheel',ev=>{ ev.preventDefault(); let dy=ev.deltaY;
      if(ev.deltaMode===1)dy*=16; else if(ev.deltaMode===2)dy*=400; wa+=dy;
      if(!wt){ wt=setTimeout(()=>{ wt=null; let s=Math.max(-CAP,Math.min(CAP,Math.trunc(wa/STEP)));
        if(s){ wa-=s*STEP; post('/browse',String(s)); } else if(Math.abs(wa)>STEP*4){ wa=0; } },70); }
    },{passive:false}); }
  return b;
}

function buildWidget(c){
  if(c.type==='knob') return buildKnob(c);
  if(c.type==='vfader'||c.type==='vfader-c') return buildFader(c);
  if(c.type==='hfader') return buildXfader(c);
  if(c.type==='rotary') return buildEncoder(c, d=>{ const s=d>0?c.specUp:c.specDown;
      if(s) ctrl(s); }, c.id.indexOf('jog')>=0?84:56);
  return buildButton(c);   // btn (default)
}

// ================= render ==================================================
function render(){
  const cols={deck1:document.getElementById('deck1'),center:document.getElementById('center'),
              deck2:document.getElementById('deck2')};
  for(const sec of LAYOUT){
    const host=cols[sec.col];
    if(sec.screen){ const sw=document.createElement('div'); sw.className='screenwrap';
      const sc=document.createElement('div'); sc.id='screen'; sw.appendChild(sc); host.appendChild(sw); continue; }
    const card=document.createElement('div'); card.className='card grp';
    if(sec.t){ const gt=document.createElement('div'); gt.className='gt'; gt.textContent=sec.t; card.appendChild(gt); }
    const row=document.createElement('div'); row.className='row'+(sec.wide?' center':'');
    for(const id of (sec.ids||[])){ const c=CMAP[id]; if(c) row.appendChild(buildWidget(c)); }
    // the browse section carries the endless encoder + its push/load row
    if(sec.encoder){
      const enc=buildEncoder({id:'browse_enc',label:'BROWSE'}, d=>post('/browse',String(d)), 76);
      row.appendChild(enc);
      for(const id of (sec.after||[])){ const c=CMAP[id]; if(c) row.appendChild(buildWidget(c)); }
    }
    card.appendChild(row); host.appendChild(card);
  }
}

// ================= live screen (noVNC push, or /raw poll) ==================
const VNC=new URLSearchParams(location.search).get('vnc');
const conn=document.getElementById('conn');
let rfb=null, rawCv=null, rawCtx=null, imgData=null;
async function startScreen(){
  const host=document.getElementById('screen'); if(!host) return;
  if(VNC){
    let RFB; try{ ({default:RFB}=await import('/novnc/core/rfb.js')); }
    catch(e){ conn.textContent='screen: noVNC load failed'; return; }
    const connect=()=>{ conn.className='conn'; conn.textContent='screen: connecting…';
      rfb=new RFB(host,VNC); rfb.viewOnly=true; rfb.scaleViewport=true; rfb.clipViewport=false; rfb.background='#000';
      rfb.addEventListener('connect',()=>{ conn.className='conn up'; conn.textContent='screen: live'; });
      rfb.addEventListener('disconnect',()=>{ conn.className='conn'; conn.textContent='screen: no QEMU'; setTimeout(connect,1000); }); };
    connect();
  } else {
    rawCv=document.createElement('canvas'); rawCv.width=800; rawCv.height=480; host.appendChild(rawCv); rawCtx=rawCv.getContext('2d');
    const pump=async()=>{ try{ const r=await fetch('/raw?t='+Date.now(),{cache:'no-store'}); if(!r.ok) throw 0;
      const w=+r.headers.get('X-Width')||800,h=+r.headers.get('X-Height')||480;
      const buf=new Uint8Array(await r.arrayBuffer());
      if(rawCv.width!==w||rawCv.height!==h){ rawCv.width=w; rawCv.height=h; imgData=null; }
      if(!imgData) imgData=rawCtx.createImageData(w,h); const d=imgData.data,n=w*h;
      for(let i=0,j=0;i<n;i++){ d[j++]=buf[i*3]; d[j++]=buf[i*3+1]; d[j++]=buf[i*3+2]; d[j++]=255; }
      rawCtx.putImageData(imgData,0,0); conn.className='conn up'; conn.textContent='screen: live';
      requestAnimationFrame(pump);
    }catch(e){ conn.className='conn'; conn.textContent='screen: no QEMU'; setTimeout(pump,700); } };
    pump();
  }
}

// ================= init ====================================================
function init(){
  if(!Kn){ log('Knobs library failed to load (/knobs/knobs.js)'); }
  render();
  startScreen();
  document.getElementById('src0').addEventListener('click',()=>toggleSrc(0));
  document.getElementById('src1').addEventListener('click',()=>toggleSrc(1));
  document.getElementById('brel').addEventListener('click',()=>{ release(); mainkeyRelease();
    document.querySelectorAll('.pad.down').forEach(e=>e.classList.remove('down')); log('⏹ release all'); });
  setSrc(0,'DECK'); setSrc(1,'DECK');
}
init();
</script>
